<section class="slide" id="d101-karpenter-loop" data-steps="5">
  <p class="kicker reveal">karpenter</p>
  <p class="statement reveal">A pending pod becomes a node in five moves.</p>
  <div class="stage reveal">
    <svg class="diagram" viewBox="0 0 1120 520" role="img" aria-labelledby="d101-karpenter-loop-t d101-karpenter-loop-d">
      <title id="d101-karpenter-loop-t">A pending vllm pod travels through five Karpenter stations until it is bound to a ready node</title>
      <desc id="d101-karpenter-loop-d">A pod token labelled vllm pod, requesting nvidia.com/gpu: 1, starts at the left of a row of five station cards, marked Pending. It moves one station per step: 1 watch, Karpenter finds the provisionable pod; 2 bin-pack, the pod is shown fitting a simulated node outline; 3 NodeClaim, a g7e.2xlarge with 8 vCPU and 1 GPU is created; 4 launch, a Bottlerocket node with the aws-k8s-nvidia AMI boots; 5 Ready, the node advertises nvidia.com/gpu: 1 and kube-scheduler binds the pod, which turns Running. Footer: Karpenter launches the node; kube-scheduler still binds the pod.</desc>
      <g id="d101-karpenter-loop-g"></g>
    </svg>
  </div>

  <style>
    #d101-karpenter-loop svg.diagram{width:100%;height:100%;max-width:none;}
    #d101-karpenter-loop text{font-family:var(--font-mono);}
    #d101-karpenter-loop .rail{stroke:var(--color-border);stroke-width:2.5;}
    #d101-karpenter-loop .dot{fill:var(--color-text-faint);}
    #d101-karpenter-loop .cardbox{fill:var(--color-surface-deep);stroke:var(--color-border);stroke-width:2.5;transition:stroke .4s,fill .4s;}
    #d101-karpenter-loop .ctitle{font-size:24px;text-anchor:middle;fill:var(--color-text-faint);transition:fill .4s;}
    #d101-karpenter-loop .cdet{font-size:22px;text-anchor:middle;fill:var(--color-text-dim);transition:fill .4s;}
    #d101-karpenter-loop .pic{fill:none;stroke:var(--color-text-dim);stroke-width:3;transition:stroke .4s;}
    #d101-karpenter-loop .picdash{stroke-dasharray:8 8;}
    #d101-karpenter-loop .picf{fill:var(--color-text-dim);transition:fill .4s;}
    #d101-karpenter-loop .nbox{fill:var(--color-surface-deep);stroke:var(--color-text-dim);stroke-width:3;transition:stroke .4s;}
    #d101-karpenter-loop .nlab{font-size:20px;text-anchor:middle;fill:var(--color-text-muted);}
    #d101-karpenter-loop .btrack{fill:var(--color-surface-deep);stroke:var(--color-text-faint);stroke-width:2;}
    #d101-karpenter-loop .bfill{fill:var(--color-text-dim);transition:fill .4s;}
    #d101-karpenter-loop .st-active .cardbox{stroke:var(--color-accent);fill:color-mix(in oklab,var(--color-accent) 12%,var(--color-surface-deep));}
    #d101-karpenter-loop .st-active .ctitle{fill:var(--color-accent);}
    #d101-karpenter-loop .st-active .cdet{fill:var(--color-text-soft);}
    #d101-karpenter-loop .st-active .pic{stroke:var(--color-accent);}
    #d101-karpenter-loop .st-active .picf{fill:var(--color-accent);}
    #d101-karpenter-loop .st-active .nbox{stroke:var(--color-accent);}
    #d101-karpenter-loop .st-active .bfill{fill:var(--color-accent);}
    #d101-karpenter-loop .st-done .cardbox{stroke:var(--color-border-strong);}
    #d101-karpenter-loop .st-done .ctitle{fill:var(--color-text-soft);}
    #d101-karpenter-loop .st-done .cdet{fill:var(--color-text-muted);}
    #d101-karpenter-loop .st-done .pic{stroke:var(--color-text-muted);}
    #d101-karpenter-loop .st-done .picf{fill:var(--color-text-muted);}
    #d101-karpenter-loop .st-done .nbox{stroke:var(--color-text-muted);}
    #d101-karpenter-loop .st-done .bfill{fill:var(--color-text-muted);}
    #d101-karpenter-loop .pod{fill:var(--color-surface-deep);stroke:var(--color-border-strong);stroke-width:2.5;transition:stroke .4s;}
    #d101-karpenter-loop .podrun{stroke:var(--color-accent);}
    #d101-karpenter-loop .podt1{font-size:20px;text-anchor:middle;fill:var(--color-text);}
    #d101-karpenter-loop .podt2{font-size:20px;text-anchor:middle;fill:var(--color-text-muted);}
    /* amber = "Pending" is the waiting/attention state; the single warning colour this slide uses */
    #d101-karpenter-loop .stat{font-size:20px;text-anchor:middle;transition:fill .4s;}
    #d101-karpenter-loop .stat-wait{fill:#f59e0b;}
    #d101-karpenter-loop .stat-run{fill:var(--color-accent);}
    #d101-karpenter-loop .noframe rect{fill:none;stroke:var(--color-accent);stroke-width:2.5;stroke-dasharray:8 8;}
    #d101-karpenter-loop .cap{font-size:24px;text-anchor:middle;fill:var(--color-text-muted);}
    #d101-karpenter-loop .caplog{font-size:24px;text-anchor:middle;fill:var(--color-text-soft);}
    #d101-karpenter-loop .capfoot{font-size:24px;text-anchor:middle;fill:var(--color-accent);}
    #d101-karpenter-loop [data-from]{opacity:0;transition:opacity .5s;}
    #d101-karpenter-loop [data-from].on{opacity:1;}
  </style>

  <script>
    (function () {
      var ID = 'd101-karpenter-loop';
      var NS = 'http://www.w3.org/2000/svg';
      function el(tag, attrs, parent, text) {
        var e = document.createElementNS(NS, tag);
        Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
        if (text !== undefined) e.textContent = text;
        if (parent) parent.appendChild(e);
        return e;
      }

      // five 190-wide cards, 21 gap, row x 43..1077 (centre of the 1120 box)
      var CARD_W = 190, CARD_X0 = 43, PITCH = 211, CARD_TOP = 160, CARD_H = 230;
      var C = [0, 1, 2, 3, 4].map(function (k) { return CARD_X0 + k * PITCH + CARD_W / 2; }); // card centres
      // pod pill: 230 wide so the 204-unit resource line keeps 13 units of padding per side.
      // State 0: pill left edge at the first card's left edge. Steps 1..5: centred on the card.
      var PILL_W = 230;
      var POS = [CARD_X0 + PILL_W / 2].concat(C);
      var TITLES = ['1 watch', '2 bin-pack', '3 NodeClaim', '4 launch', '5 Ready'];
      var DET = [
        ['pending pod', 'not placed'],
        ['tight fit', 'one node'],
        ['g7e.2xlarge:', '8 vCPU, 1 GPU'],
        ['EC2NodeClass', 'RunInstances'],
        ['scheduler', 'binds pod']
      ];
      // vertical bands: pill/track y 30..90 (rail 60), status label 118..138,
      // card row 160..390, caption band 440..480
      var RAIL_Y = 60;

      var g = document.getElementById(ID + '-g');

      // rail across the card row, one stop dot per station
      el('line', { 'class': 'rail', x1: CARD_X0, y1: RAIL_Y, x2: CARD_X0 + 5 * CARD_W + 4 * (PITCH - CARD_W), y2: RAIL_Y }, g);
      C.forEach(function (x) { el('circle', { 'class': 'dot', cx: x, cy: RAIL_Y, r: 4 }, g); });

      // station cards (title y 192, icon zone 205..305, detail lines y 344/372)
      var cards = [];
      for (var k = 0; k < 5; k++) {
        var cx = C[k];
        var card = el('g', { 'class': 'st st-future' }, g);
        el('rect', { 'class': 'cardbox', x: cx - CARD_W / 2, y: CARD_TOP, width: CARD_W, height: CARD_H, rx: 12 }, card);
        el('text', { 'class': 'ctitle', x: cx, y: 192 }, card, TITLES[k]);
        el('text', { 'class': 'cdet', x: cx, y: 344 }, card, DET[k][0]);
        el('text', { 'class': 'cdet', x: cx, y: 372 }, card, DET[k][1]);
        cards.push(card);
      }
      // card 1: a magnifier over the small pod square
      el('circle', { 'class': 'pic', cx: C[0] - 6, cy: 250, r: 40 }, cards[0]);
      el('line', { 'class': 'pic', x1: C[0] + 22, y1: 278, x2: C[0] + 46, y2: 302 }, cards[0]);
      el('rect', { 'class': 'picf', x: C[0] - 19, y: 237, width: 26, height: 26, rx: 5 }, cards[0]);
      // card 2: node outline being filled by the pod
      el('rect', { 'class': 'pic picdash', x: C[1] - 56, y: 212, width: 112, height: 80, rx: 10 }, cards[1]);
      el('rect', { 'class': 'picf', x: C[1] - 15, y: 237, width: 30, height: 30, rx: 5 }, cards[1]);
      // card 3: the claim document
      el('rect', { 'class': 'pic', x: C[2] - 58, y: 210, width: 116, height: 84, rx: 10 }, cards[2]);
      el('line', { 'class': 'pic', x1: C[2] - 42, y1: 242, x2: C[2] + 42, y2: 242 }, cards[2]);
      el('line', { 'class': 'pic', x1: C[2] - 42, y1: 266, x2: C[2] + 30, y2: 266 }, cards[2]);
      // card 4: the node box with a boot bar
      el('rect', { 'class': 'nbox', x: C[3] - 60, y: 211, width: 120, height: 78, rx: 10 }, cards[3]);
      el('text', { 'class': 'nlab', x: C[3], y: 238 }, cards[3], 'node');
      el('rect', { 'class': 'btrack', x: C[3] - 48, y: 262, width: 96, height: 12, rx: 6 }, cards[3]);
      var bfill = el('rect', { 'class': 'bfill', x: C[3] - 48, y: 262, width: 0.01, height: 12, rx: 6 }, cards[3]);
      // card 5: the ready node with a check and its advertised GPU
      el('rect', { 'class': 'nbox', x: C[4] - 60, y: 211, width: 120, height: 78, rx: 10 }, cards[4]);
      el('path', { 'class': 'pic', 'stroke-width': '3.5', d: 'M ' + (C[4] - 24) + ' 240 l 12 12 l 22 -24' }, cards[4]);
      el('text', { 'class': 'cdet', x: C[4], y: 278 }, cards[4], 'gpu: 1');

      // simulated node outline around the pill, shown while bin-packing (step 2)
      var no = el('g', { 'class': 'noframe', 'data-from': '2', 'data-until': '3' }, g);
      el('rect', { x: C[1] - PILL_W / 2 - 13, y: RAIL_Y - 38, width: PILL_W + 26, height: 76, rx: 14 }, no);

      // one caption line per state (band y 440..480); the footer is the final state
      el('g', { 'data-from': '0', 'data-until': '1' }, g).appendChild(el('text', { 'class': 'cap', x: 560, y: 468 }, null, 'one pending pod asks for nvidia.com/gpu: 1'));
      el('g', { 'data-from': '1', 'data-until': '2' }, g).appendChild(el('text', { 'class': 'caplog', x: 560, y: 468 }, null, 'found provisionable pod(s)'));
      el('g', { 'data-from': '2', 'data-until': '3' }, g).appendChild(el('text', { 'class': 'caplog', x: 560, y: 468 }, null, 'computed new nodeclaim(s) to fit pod(s)'));
      el('g', { 'data-from': '3', 'data-until': '4' }, g).appendChild(el('text', { 'class': 'caplog', x: 560, y: 468 }, null, 'created nodeclaim'));
      el('g', { 'data-from': '4', 'data-until': '5' }, g).appendChild(el('text', { 'class': 'cap', x: 560, y: 468 }, null, 'Bottlerocket (aws-k8s-nvidia AMI), booting'));
      el('g', { 'data-from': '5' }, g).appendChild(el('text', { 'class': 'capfoot', x: 560, y: 468 }, null, 'Karpenter launches the node; kube-scheduler still binds the pod.'));

      // pod pill (built centred on the rail, moved by transform)
      var podG = el('g', {}, g);
      el('rect', { 'class': 'pod', x: -PILL_W / 2, y: -28, width: PILL_W, height: 56, rx: 28 }, podG);
      el('text', { 'class': 'podt1', x: 0, y: -4 }, podG, 'vllm pod');
      el('text', { 'class': 'podt2', x: 0, y: 18 }, podG, 'nvidia.com/gpu: 1');
      // status label in its own band (absolute y 118..138; podG is already
      // translated to the rail, so local y = 133 - RAIL_Y = 73). Clears the pill
      // bottom (88) by 30, the step 2 outline bottom (98) by 20, and the card
      // row top (160) by 22.
      var stat = el('text', { 'class': 'stat stat-wait', x: 0, y: 73 }, podG, 'Pending');
      var podBox = podG.querySelector('.pod');

      var px = POS[0], bar = 0, cancel = null;
      function setUI(n) {
        cards.forEach(function (c, k) {
          c.setAttribute('class', 'st ' + (n > k + 1 ? 'st-done' : n === k + 1 ? 'st-active' : 'st-future'));
        });
        if (n >= 5) {
          stat.textContent = 'Running';
          stat.setAttribute('class', 'stat stat-run');
          podBox.setAttribute('class', 'pod podrun');
        } else {
          stat.textContent = 'Pending';
          stat.setAttribute('class', 'stat stat-wait');
          podBox.setAttribute('class', 'pod');
        }
      }
      function draw() {
        podG.setAttribute('transform', 'translate(' + px.toFixed(1) + ' ' + RAIL_Y + ')');
        bfill.setAttribute('width', Math.max(0.01, 96 * bar).toFixed(1));
      }
      setUI(0);
      draw();

      Deck.slide(ID, {
        enter: function () {
          px = POS[0]; bar = 0;
          if (cancel) { cancel(); cancel = null; }
          setUI(0); draw();
        },
        step: function (n, prev, c) {
          n = Math.max(0, Math.min(5, n));
          setUI(n);
          var tpx = POS[n], tbar = n >= 4 ? 1 : 0;
          if (cancel) { cancel(); cancel = null; }
          if (c.instant) { px = tpx; bar = tbar; draw(); return; }
          var fpx = px, fbar = bar;
          cancel = Deck.tween(600, function (k) {
            px = Deck.lerp(fpx, tpx, k);
            bar = Deck.lerp(fbar, tbar, k);
            draw();
          });
        }
      });
    })();
  </script>
</section>
