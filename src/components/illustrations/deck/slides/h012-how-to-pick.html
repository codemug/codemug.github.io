<section class="slide" id="h012-how-to-pick" data-steps="3">
  <p class="kicker reveal">how to pick</p>
  <p class="statement reveal">Pick in this order: capacity, bandwidth, compute, then the wire.</p>
  <div class="stage reveal">
    <svg class="diagram" viewBox="0 0 1120 520" role="img" aria-labelledby="h012-how-to-pick-t h012-how-to-pick-d">
      <title id="h012-how-to-pick-t">The four questions in order: capacity, bandwidth, compute and precision, interconnect, and the defaults</title>
      <desc id="h012-how-to-pick-d">Four question boxes stacked top to bottom, one appearing per step, a short downward arrow between each pair marking the order. One, capacity, a hard gate: does the model, its KV cache and a little room fit; if not, quantize down, or accept the interconnect tax. Two, bandwidth: how fast do you need to decode; the number is set by memory bandwidth, HBM versus GDDR versus unified. Three, compute: does the chip natively multiply the format you quantize to; otherwise the quantization saves memory and buys no speed. Four, interconnect, only if one chip is not enough: NVLink and NVSwitch to spread one model wide, EFA-class networking across machines. The last step adds a defaults box: NVIDIA for least resistance, AMD for the same serving for less money, Apple or DGX Spark or Strix Halo for local, Google TPU if already on Google Cloud, AWS to rent, vLLM on top until there is a reason for something sharper.</desc>
      <g id="h012-how-to-pick-g"></g>
    </svg>
  </div>

  <style>
    #h012-how-to-pick svg.diagram{width:100%;height:100%;max-width:none;}
    #h012-how-to-pick text{font-family:var(--font-mono);}
    #h012-how-to-pick .qbox{fill:var(--color-surface-deep);stroke:var(--color-border);stroke-width:2;}
    #h012-how-to-pick .q1{font-size:20px;font-weight:600;fill:var(--color-text);}
    #h012-how-to-pick .qnum{fill:var(--color-accent);}
    #h012-how-to-pick .q2{font-size:20px;fill:var(--color-text-soft);}
    #h012-how-to-pick .arrow{stroke:var(--color-border-strong);stroke-width:2.5;}
    #h012-how-to-pick .arrowtip{fill:var(--color-border-strong);}
    #h012-how-to-pick .dbox{fill:var(--color-surface-deep);stroke:var(--color-accent);stroke-width:2;}
    #h012-how-to-pick .dhead{font-size:20px;font-weight:600;fill:var(--color-accent);}
    #h012-how-to-pick .dline{font-size:20px;fill:var(--color-text-soft);}
    #h012-how-to-pick [data-from]{opacity:0;transition:opacity .5s;}
    #h012-how-to-pick [data-from].on{opacity:1;}
  </style>

  <script>
    (function () {
      var ID = 'h012-how-to-pick';
      var NS = 'http://www.w3.org/2000/svg';
      function el(tag, attrs, parent, text) {
        var e = document.createElementNS(NS, tag);
        Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
        if (text !== undefined) e.textContent = text;
        if (parent) parent.appendChild(e);
        return e;
      }
      var g = document.getElementById(ID + '-g');

      // four question boxes, tops at y 20 / 119 / 218 / 317, 67 tall; line 1
      // baseline 29 below the top, line 2 49, so the text keeps 14 units of
      // padding above the first line and below the last. Between each pair a
      // 20-unit downward arrow, 20 units clear of the text on both sides,
      // drawn in the same step as the box below it.
      function arrow(parent, top) {
        el('line', { 'class': 'arrow', x1: 550, y1: top, x2: 550, y2: top + 10 }, parent);
        el('polygon', { 'class': 'arrowtip', points: '542,' + (top + 10) + ' 558,' + (top + 10) + ' 550,' + (top + 20) }, parent);
      }
      function box(parent, top, num, line1, line2) {
        el('rect', { 'class': 'qbox', x: 50, y: top, width: 1000, height: 67, rx: 10 }, parent);
        var t = el('text', { 'class': 'q1', x: 74, y: top + 29 }, parent);
        el('tspan', { 'class': 'qnum' }, t, num + ' ');
        el('tspan', {}, t, line1);
        el('text', { 'class': 'q2', x: 74, y: top + 49 }, parent, line2);
      }

      var Q = [
        ['1.', 'capacity, hard gate: does the model, its KV cache and a little room fit?', 'if not: quantize down, or accept the interconnect tax'],
        ['2.', 'bandwidth: how fast do you need to decode?', 'the number is set by memory bandwidth: HBM versus GDDR versus unified'],
        ['3.', 'compute: does the chip natively multiply the format you quantize to?', 'otherwise the quantization saves memory and buys no speed'],
        ['4.', 'interconnect, only if one chip is not enough:', 'NVLink and NVSwitch to spread one model wide, EFA-class across machines']
      ];

      // one question per step: box 1 is base, the rest reveal in order,
      // each with the arrow that leads into it
      box(g, 20, Q[0][0], Q[0][1], Q[0][2]);
      for (var k = 1; k < 4; k++) {
        var s = el('g', { 'data-from': String(k) }, g);
        arrow(s, 20 + k * 99 - 26);
        box(s, 20 + k * 99, Q[k][0], Q[k][1], Q[k][2]);
      }

      // last step adds the defaults box, 12 below the last question box, with
      // 14 units of padding above the label and below the last line
      var gD = el('g', { 'data-from': '3' }, g);
      el('rect', { 'class': 'dbox', x: 50, y: 396, width: 1000, height: 104, rx: 10 }, gD);
      el('text', { 'class': 'dhead', x: 74, y: 425 }, gD, 'defaults');
      el('text', { 'class': 'dline', x: 74, y: 444 }, gD, 'NVIDIA for least resistance, AMD for the same serving for less money, Apple');
      el('text', { 'class': 'dline', x: 74, y: 463 }, gD, 'or DGX Spark or Strix Halo for local, Google TPU if already on Google Cloud,');
      el('text', { 'class': 'dline', x: 74, y: 482 }, gD, 'AWS to rent, vLLM on top until there is a reason for something sharper');

      // reveals are all data-from driven; the slide still registers its hooks
      Deck.slide(ID, {
        enter: function () {},
        step: function (n, prev, c) {}
      });
    })();
  </script>
</section>
