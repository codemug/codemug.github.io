<section class="slide" id="d203-prefix-grid" data-steps="3">
  <p class="kicker reveal">prefix cache</p>
  <p class="statement reveal">Prefix hits land on block boundaries.</p>
  <div class="stage reveal">
    <svg class="diagram" viewBox="0 0 1120 520" role="img" aria-labelledby="d203-prefix-grid-t d203-prefix-grid-d">
      <title id="d203-prefix-grid-t">A 3,000 token prompt on a 1,600 token block grid: a 1,000 token shared prefix gets 0 hit tokens, a 1,700 token one gets 1,600</title>
      <desc id="d203-prefix-grid-d">The prompt of 3,000 tokens covers block 0 (tokens 0 to 1,599, whole) and 1,400 tokens of block 1. Step one: a shared prefix of 1,000 tokens never fills block 0, so it gets 0 hit tokens and is recomputed. Step two: a shared prefix of 1,700 tokens fills block 0, so 1,600 tokens are hits and the other 100 are recomputed. Step three: the rule, hit tokens = floor(shared / 1,600) x 1,600. Block size 1,600 is computed for fp8 KV with MTP 3.</desc>
      <g id="d203-prefix-grid-g"></g>
    </svg>
  </div>

  <style>
    #d203-prefix-grid svg.diagram{width:100%;height:100%;max-width:none;}
    #d203-prefix-grid text{font-family:var(--font-mono);}
    #d203-prefix-grid .hd{font-size:24px;font-weight:700;fill:var(--color-text);}
    #d203-prefix-grid .blk{fill:color-mix(in oklab,var(--color-text-muted) 14%,var(--color-surface-deep));stroke:var(--color-text-dim);stroke-width:2.5;}
    #d203-prefix-grid .free{fill:none;stroke:var(--color-text-faint);stroke-width:2.5;stroke-dasharray:7 6;}
    #d203-prefix-grid .bl{font-size:24px;text-anchor:middle;fill:var(--color-text);}
    #d203-prefix-grid .bs{font-size:20px;text-anchor:middle;fill:var(--color-text-muted);}
    #d203-prefix-grid .tick{stroke:var(--color-text-dim);stroke-width:2;}
    #d203-prefix-grid .tl{font-size:22px;fill:var(--color-text-muted);}
    #d203-prefix-grid .guide{stroke:var(--color-text-faint);stroke-width:2;stroke-dasharray:6 6;}
    #d203-prefix-grid .sl{font-size:24px;font-weight:700;fill:var(--color-text);}
    #d203-prefix-grid .hit{fill:var(--color-accent);}
    #d203-prefix-grid .miss{fill:color-mix(in oklab,var(--color-accent) 14%,var(--color-surface-deep));stroke:var(--color-accent);stroke-width:2.5;stroke-dasharray:6 5;}
    #d203-prefix-grid .res{font-size:36px;font-weight:700;}
    #d203-prefix-grid .res0{fill:var(--color-text-muted);}
    #d203-prefix-grid .res1{fill:var(--color-accent);}
    #d203-prefix-grid .why{font-size:22px;fill:var(--color-text-muted);}
    #d203-prefix-grid .lgt{font-size:22px;fill:var(--color-text-muted);}
    #d203-prefix-grid .rule{font-size:26px;font-weight:700;fill:var(--color-accent);}
  </style>

  <script>
    (function () {
      var ID = 'd203-prefix-grid';
      var NS = 'http://www.w3.org/2000/svg';
      function el(tag, attrs, parent, text) {
        var e = document.createElementNS(NS, tag);
        Object.keys(attrs || {}).forEach(function (key) { e.setAttribute(key, attrs[key]); });
        if (text !== undefined) e.textContent = text;
        if (parent) parent.appendChild(e);
        return e;
      }
      function n(v) { return v.toLocaleString('en-US'); }

      // ---- numbers: L2 NOTES.md Diagram idea 4, NOTES-3.md (block 1600 tokens, as logged by a running pod), RULINGS R1
      var BLOCK = 1600, PROMPT = 3000, SHARED_A = 1000, SHARED_B = 1700;
      var X0 = 40, PX = 1040 / (2 * BLOCK);           // 0.325 px per token, two blocks wide
      function xt(t) { return X0 + t * PX; }
      function hits(shared) { return Math.floor(shared / BLOCK) * BLOCK; }
      function clamp(v) { return Math.max(0, Math.min(1, v)); }

      var g = document.getElementById(ID + '-g');

      // ---- the prompt on the block grid (always visible)
      el('text', { 'class': 'hd', x: 40, y: 40 }, g, n(PROMPT) + ' token prompt, block size ' + n(BLOCK) + ' tokens');
      var GY = 58, GH = 72;
      el('rect', { 'class': 'blk', x: xt(0), y: GY, width: BLOCK * PX, height: GH }, g);
      el('rect', { 'class': 'blk', x: xt(BLOCK), y: GY, width: (PROMPT - BLOCK) * PX, height: GH }, g);
      el('rect', { 'class': 'free', x: xt(PROMPT), y: GY, width: (2 * BLOCK - PROMPT) * PX, height: GH }, g);
      el('text', { 'class': 'bl', x: xt(BLOCK / 2), y: GY + 32 }, g, 'block 0');
      el('text', { 'class': 'bs', x: xt(BLOCK / 2), y: GY + 58 }, g, 'tokens 0 to ' + n(BLOCK - 1));
      el('text', { 'class': 'bl', x: xt(BLOCK + (PROMPT - BLOCK) / 2), y: GY + 32 }, g, 'block 1');
      el('text', { 'class': 'bs', x: xt(BLOCK + (PROMPT - BLOCK) / 2), y: GY + 58 }, g, n(PROMPT - BLOCK) + ' of ' + n(BLOCK) + ' tokens used');
      [[0, 'start', '0'], [BLOCK, 'middle', n(BLOCK)], [PROMPT, 'middle', n(PROMPT)]].forEach(function (d) {
        el('line', { 'class': 'tick', x1: xt(d[0]), x2: xt(d[0]), y1: GY + GH, y2: GY + GH + 12 }, g);
        el('text', { 'class': 'tl', x: xt(d[0]), y: GY + GH + 34, 'text-anchor': d[1] }, g, d[2]);
      });
      el('line', { 'class': 'guide', x1: xt(BLOCK), x2: xt(BLOCK), y1: GY + GH + 44, y2: 410 }, g);

      // ---- one scenario row: label, track, hit/miss bar, result text
      var TX = 610;
      function row(y, label) {
        var grp = el('g', {}, g);
        el('text', { 'class': 'sl', x: 40, y: y }, grp, label);
        var hit = el('rect', { 'class': 'hit', x: xt(0), y: y + 14, width: 0, height: 48 }, grp);
        var miss = el('rect', { 'class': 'miss', x: xt(0), y: y + 14, width: 0, height: 48 }, grp);
        var res = el('text', { 'class': 'res res0', x: TX, y: y + 46 }, grp, '0 hit tokens');
        var why = el('text', { 'class': 'why', x: TX, y: y + 78 }, grp, '');
        return { grp: grp, hit: hit, miss: miss, res: res, why: why };
      }
      var A = row(206, 'A: shared prefix of ' + n(SHARED_A) + ' tokens');
      var B = row(326, 'B: shared prefix of ' + n(SHARED_B) + ' tokens');
      A.why.textContent = n(SHARED_A) + ' < ' + n(BLOCK) + ': block 0 never fills';
      B.why.textContent = 'block 0 is whole, ' + n(SHARED_B - BLOCK) + ' recomputed';

      // ---- legend and rule
      var leg = el('g', {}, g);
      el('rect', { 'class': 'hit', x: 40, y: 438, width: 24, height: 24, rx: 3 }, leg);
      el('text', { 'class': 'lgt', x: 76, y: 457 }, leg, 'hit: reused from cache');
      el('rect', { 'class': 'miss', x: 400, y: 438, width: 24, height: 24, rx: 3 }, leg);
      el('text', { 'class': 'lgt', x: 436, y: 457 }, leg, 'shared, but recomputed');
      var rule = el('text', { 'class': 'rule', x: 40, y: 494 }, g, 'hit tokens = floor(shared / ' + n(BLOCK) + ') x ' + n(BLOCK));

      // ---- state: s[0] = A bar, s[1] = B bar, s[2] = rule
      var s = [0, 0, 0], cancel = null;
      function paint(r, shared, k) {
        var m = shared * k, h = hits(m);
        r.hit.setAttribute('width', (h * PX).toFixed(2));
        r.miss.setAttribute('x', xt(h).toFixed(2));
        r.miss.setAttribute('width', ((m - h) * PX).toFixed(2));
        r.res.textContent = n(h) + ' hit tokens';
        r.res.setAttribute('class', 'res ' + (h > 0 ? 'res1' : 'res0'));
        r.res.setAttribute('opacity', clamp(k * 4).toFixed(3));
        r.why.setAttribute('opacity', clamp((k - 0.7) / 0.3).toFixed(3));
        r.grp.setAttribute('opacity', clamp(k * 6).toFixed(3));
      }
      function draw() {
        paint(A, SHARED_A, s[0]);
        paint(B, SHARED_B, s[1]);
        leg.setAttribute('opacity', clamp(s[0] * 4).toFixed(3));
        rule.setAttribute('opacity', s[2].toFixed(3));
      }
      draw();

      Deck.slide(ID, {
        enter: function () { s = [0, 0, 0]; draw(); },
        step: function (m, prev, c) {
          var t = [m >= 1 ? 1 : 0, m >= 2 ? 1 : 0, m >= 3 ? 1 : 0];
          if (cancel) { cancel(); cancel = null; }
          if (c.instant) { s = t; draw(); return; }
          var f = s.slice();
          cancel = Deck.tween(1100, function (kk) {
            s = f.map(function (v, i) { return Deck.lerp(v, t[i], kk); });
            draw();
          });
        }
      });
    })();
  </script>
</section>
