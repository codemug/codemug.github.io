<section class="slide" id="t410-total-vs-active" data-steps="3">
  <p class="kicker reveal">mixture of experts</p>
  <p class="statement reveal">Total parameters versus active parameters.</p>
  <div class="stage reveal">
    <svg class="diagram" viewBox="0 0 1120 520" role="img" aria-labelledby="t410-total-vs-active-t t410-total-vs-active-d">
      <title id="t410-total-vs-active-t">Total parameters versus active parameters</title>
      <desc id="t410-total-vs-active-d">Four rows, one per model. Each row shows the model name, a grey bar of equal length standing for total parameters, a cyan segment showing the share of parameters active for one token, a percent label, and total over active numbers. Qwen3.8-27B dense uses 100 percent, Mixtral 8x7B 28 percent, Qwen3-30B-A3B 11 percent, DeepSeek-V3 6 percent. The rows appear one by one; the final step adds a caption about a layer with 8 experts and top 2.</desc>
      <!-- All grey bars are the same pixel length (460), each normalized to its own total;
           the cyan segment is the active share (active/total). Numbers from deck/data/part2.json. -->
      <g id="t410-total-vs-active-r0">
        <text class="rowname" x="40" y="118">Qwen3.8-27B (dense)</text>
        <rect class="bar" x="330" y="82" width="460" height="56" rx="8"/>
        <rect class="seg" id="t410-total-vs-active-s0" x="330" y="82" width="0" height="56" rx="8"/>
        <text class="segpct" id="t410-total-vs-active-p0" x="802" y="118">100%</text>
        <text class="nums" id="t410-total-vs-active-v0" x="1080" y="118" text-anchor="end">27.8B / 27.8B</text>
      </g>
      <g id="t410-total-vs-active-r1">
        <text class="rowname" x="40" y="213">Mixtral 8x7B</text>
        <rect class="bar" x="330" y="177" width="460" height="56" rx="8"/>
        <rect class="seg" id="t410-total-vs-active-s1" x="330" y="177" width="0" height="56" rx="8"/>
        <text class="segpct" id="t410-total-vs-active-p1" x="468.9" y="213">28%</text>
        <text class="nums" id="t410-total-vs-active-v1" x="1080" y="213" text-anchor="end">46.7B / 12.9B</text>
      </g>
      <g id="t410-total-vs-active-r2">
        <text class="rowname" x="40" y="308">Qwen3-30B-A3B</text>
        <rect class="bar" x="330" y="272" width="460" height="56" rx="8"/>
        <rect class="seg" id="t410-total-vs-active-s2" x="330" y="272" width="0" height="56" rx="8"/>
        <text class="segpct" id="t410-total-vs-active-p2" x="392.5" y="308">11%</text>
        <text class="nums" id="t410-total-vs-active-v2" x="1080" y="308" text-anchor="end">30.5B / 3.35B</text>
      </g>
      <g id="t410-total-vs-active-r3">
        <text class="rowname" x="40" y="403">DeepSeek-V3</text>
        <rect class="bar" x="330" y="367" width="460" height="56" rx="8"/>
        <rect class="seg" id="t410-total-vs-active-s3" x="330" y="367" width="0" height="56" rx="8"/>
        <text class="segpct" id="t410-total-vs-active-p3" x="367.4" y="403">6%</text>
        <text class="nums" id="t410-total-vs-active-v3" x="1080" y="403" text-anchor="end">671B / 37B</text>
      </g>
      <text class="caption" id="t410-total-vs-active-caption" x="560" y="478" text-anchor="middle">a layer with 8 experts, top 2 does about a quarter of the feed-forward multiply-adds</text>
    </svg>
  </div>

  <style>
    #t410-total-vs-active svg.diagram{width:100%;height:100%;max-width:none;}
    #t410-total-vs-active text{font-family:var(--font-mono);}
    #t410-total-vs-active .rowname{font-size:22px;fill:var(--color-text);}
    #t410-total-vs-active .bar{fill:#4a4a52;}
    #t410-total-vs-active .seg{fill:var(--color-accent);}
    #t410-total-vs-active .segpct{font-size:22px;fill:var(--color-accent);}
    #t410-total-vs-active .nums{font-size:22px;fill:var(--color-text);}
    #t410-total-vs-active .caption{font-size:21px;fill:var(--color-text-dim);text-anchor:middle;opacity:0;transform:translateY(8px);transition:opacity .6s ease,transform .6s ease;}
    #t410-total-vs-active .caption.show{opacity:1;transform:translateY(0);}
  </style>

  <script>
    (function () {
      var ID = 't410-total-vs-active';
      // REAL data (deck/data/part2.json) - copied as literals, do not retype from memory.
      var QWEN3_TOTAL = 27781427952;      // moe.qwen3_8_27b_is_dense.total_params (dense: total == active)
      var MIXTRAL_TOTAL = 46702792704;    // moe.mixtral.active.terms.total
      var MIXTRAL_ACTIVE = 12879925248;   // moe.mixtral.active.terms.active_params
      var QWEN30_TOTAL = 30532122624;     // moe.qwen3_30b_a3b.active.terms.total
      var QWEN30_ACTIVE = 3353032704;     // moe.qwen3_30b_a3b.active.terms.active_params
      // moe.deepseek_v3.readme_quotes[0]: "671B total parameters with 37B activated"
      var DEEPSEEK_TOTAL = 671e9;         // quoted from the model README, not recomputed
      var DEEPSEEK_ACTIVE = 37e9;         // quoted from the model README, not recomputed

      var BAR_W = 460; // px - every grey bar is the same length (own-total normalized)
      var rows = [
        { total: QWEN3_TOTAL, active: QWEN3_TOTAL },
        { total: MIXTRAL_TOTAL, active: MIXTRAL_ACTIVE },
        { total: QWEN30_TOTAL, active: QWEN30_ACTIVE },
        { total: DEEPSEEK_TOTAL, active: DEEPSEEK_ACTIVE }
      ];
      var fmtB = function (n) { return (n / 1e9).toFixed(1) + 'B'; };
      var segW = rows.map(function (r) { return r.active / r.total * BAR_W; });

      function $(s) { return document.getElementById(ID + '-' + s); }
      var g = [0, 1, 2, 3].map(function (i) { return $('r' + i); });
      var seg = [0, 1, 2, 3].map(function (i) { return $('s' + i); });
      var pct = [0, 1, 2, 3].map(function (i) { return $('p' + i); });
      var num = [0, 1, 2, 3].map(function (i) { return $('v' + i); });
      var cap = $('caption');

      // Display strings, built from the literals above (row 3 is quoted, not recomputed).
      num[0].textContent = fmtB(rows[0].total) + ' / ' + fmtB(rows[0].active);
      num[1].textContent = fmtB(rows[1].total) + ' / ' + fmtB(rows[1].active);
      num[2].textContent = fmtB(rows[2].total) + ' / ' + (rows[2].active / 1e9).toFixed(2) + 'B';
      num[3].textContent = '671B / 37B';
      rows.forEach(function (r, i) { pct[i].textContent = Math.round(100 * r.active / r.total) + '%'; });

      // Row-reveal progress 0..1 per row. Row 0 is visible from step 0; rows 1..3
      // reveal at steps 1..3. Quick fade + slide in, cyan segment grows from 0.
      function clamp(v) { return Math.max(0, Math.min(1, v)); }
      var P = [1, 0, 0, 0], cancel = null;
      function paint() {
        for (var i = 0; i < 4; i++) {
          var r = P[i];
          g[i].style.opacity = r;
          g[i].style.transform = 'translate(' + ((1 - r) * -24).toFixed(2) + 'px,0)';
          seg[i].setAttribute('width', (r * segW[i]).toFixed(2));
          pct[i].style.opacity = clamp(r * 2 - 0.8);
          num[i].style.opacity = clamp(r * 1.6 - 0.1);
        }
      }

      Deck.slide('t410-total-vs-active', {
        enter: function () { P = [1, 0, 0, 0]; cap.classList.remove('show'); paint(); },
        step: function (n, prev, c) {
          var target = [1, n >= 1 ? 1 : 0, n >= 2 ? 1 : 0, n >= 3 ? 1 : 0];
          cap.classList.toggle('show', n >= 3);
          if (cancel) { cancel(); cancel = null; }
          if (c.instant) { P = target; paint(); return; }
          var from = P.slice();
          cancel = Deck.tween(900, function (t) {
            P = [0, 1, 2, 3].map(function (i) { return Deck.lerp(from[i], target[i], t); });
            paint();
          });
        }
      });
    })();
  </script>
</section>
