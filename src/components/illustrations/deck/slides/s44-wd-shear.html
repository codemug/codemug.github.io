<section class="slide" id="s44-wd-shear" data-steps="3" data-tool="matrix blend">
  <p class="kicker reveal">feed-forward</p>
  <p class="statement reveal">Wd: how much to shear the vector for each detected pattern.</p>
  <div class="stage reveal">
    <svg class="diagram" viewBox="0 0 1120 520" role="img" aria-labelledby="s44-wd-shear-t s44-wd-shear-d">
      <title id="s44-wd-shear-t">Wd shears the vector toward Spain</title>
      <desc id="s44-wd-shear-d">On the left, the idea plane with the horizontal axis a country and the vertical axis football, the grey arrow x0 and a marker for Spain. On the right, the four rows of Wd, spain, football, trophy and 2026, each with the magnitude that survived the silencing. Step by step each row arrow is scaled by its magnitude, the four scaled arrows are stacked head to tail into the change delta, and delta is added to x0: the vector lands on Spain.</desc>
      <g id="s44-wd-shear-plane"></g>
      <g id="s44-wd-shear-arrows"></g>
      <g id="s44-wd-shear-panel"></g>
    </svg>
  </div>

  <style>
    #s44-wd-shear .statement{max-width:1040px;}
    #s44-wd-shear svg.diagram{width:100%;height:100%;max-width:none;}
    #s44-wd-shear text{font-family:var(--font-mono);}
    #s44-wd-shear .grd{stroke:var(--color-hairline);stroke-width:1;}
    #s44-wd-shear .axl{stroke:var(--color-text-faint);stroke-width:2;}
    #s44-wd-shear .axh{fill:var(--color-text-faint);}
    #s44-wd-shear .ax{font-size:22px;fill:var(--color-text-soft);}
    #s44-wd-shear .halo{paint-order:stroke;stroke:var(--color-bg);stroke-width:7px;stroke-linejoin:round;}
    #s44-wd-shear .sh{fill:none;stroke-linecap:round;}
    #s44-wd-shear .nm{font-size:24px;font-weight:600;}
    #s44-wd-shear .sp-ring{fill:none;stroke-width:3;stroke-dasharray:6 6;}
    #s44-wd-shear .sp-lab{font-size:26px;}
    #s44-wd-shear .hdr{font-size:20px;fill:var(--color-text-dim);}
    #s44-wd-shear .rule{stroke:var(--color-border);stroke-width:1;}
    #s44-wd-shear .rn{font-size:22px;font-weight:600;fill:var(--color-text-soft);}
    #s44-wd-shear .ra{font-size:22px;}
    #s44-wd-shear .rm{font-size:22px;fill:var(--color-text-muted);}
    #s44-wd-shear .rb{font-size:22px;}
    #s44-wd-shear .big{font-size:28px;}
    #s44-wd-shear .c0, #s44-wd-shear .c1, #s44-wd-shear .c2, #s44-wd-shear .c3{fill:var(--color-text-muted);transition:fill .6s;}
    #s44-wd-shear[data-cur="0"] .c0, #s44-wd-shear[data-cur="1"] .c1, #s44-wd-shear[data-cur="2"] .c2, #s44-wd-shear[data-cur="3"] .c3{fill:var(--color-accent);}
  </style>

  <script>
    (function () {
      var ID = 's44-wd-shear';
      var root = document.getElementById(ID);
      var svg = root.querySelector('svg.diagram');
      var NS = svg.namespaceURI;
      function $(s) { return document.getElementById(ID + '-' + s); }
      function el(tag, attrs, parent, text) {
        var e = document.createElementNS(NS, tag);
        Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
        if (text !== undefined) e.textContent = text;
        if (parent) parent.appendChild(e);
        return e;
      }
      function f2(x) { return x.toFixed(2); }
      function arr2(v) { return '[' + f2(v[0]) + ', ' + f2(v[1]) + ']'; }
      function trim(x) { return String(+x.toFixed(4)); }
      function arrT(v) { return '[' + trim(v[0]) + ', ' + trim(v[1]) + ']'; }

      // FEED-FORWARD TOY (all derived values are computed here)
      var X0 = [0.10, 0.20], SPAIN = [0.78, 0.95], O = [0, 0];
      var ROWS = [['spain', [0.60, 0.50], 0.93], ['football', [0.10, 0.15], 0.81], ['trophy', [0.05, 0.20], 0.64], ['2026', [0.00, 0.05], 0.58]];
      var SC = ROWS.map(function (r) { return [r[2] * r[1][0], r[2] * r[1][1]]; });
      var CH = [O];
      SC.forEach(function (s, i) { CH.push([CH[i][0] + s[0], CH[i][1] + s[1]]); });
      var D = CH[CH.length - 1];                          // Delta = sum(magnitude x row)
      var RES = [X0[0] + D[0], X0[1] + D[1]];             // x0 + Delta
      var X0D = RES;

      var OX = 110, OY = 476, U = 400, EXT = 1.05;
      var P = Deck.plane({ ox: OX, oy: OY, u: U });
      var MUTED = Deck.rgb('--color-text-muted'), ACC = Deck.rgb('--color-accent');
      function col(c) { return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(MUTED[i] + (ACC[i] - MUTED[i]) * c); }).join(',') + ')'; }

      // ---- plane
      var gp = $('plane');
      [0.5, 1].forEach(function (k) {
        el('line', { 'class': 'grd', x1: OX, y1: P.Y(k), x2: P.X(EXT), y2: P.Y(k) }, gp);
        el('line', { 'class': 'grd', x1: P.X(k), y1: OY, x2: P.X(k), y2: P.Y(EXT) }, gp);
      });
      el('line', { 'class': 'axl', x1: OX - 8, y1: OY, x2: P.X(EXT) - 8, y2: OY }, gp);
      el('line', { 'class': 'axl', x1: OX, y1: OY + 8, x2: OX, y2: P.Y(EXT) + 8 }, gp);
      el('polygon', { 'class': 'axh', points: [P.X(EXT), OY, P.X(EXT) - 14, OY - 6, P.X(EXT) - 14, OY + 6].join(' ') }, gp);
      el('polygon', { 'class': 'axh', points: [OX, P.Y(EXT), OX - 6, P.Y(EXT) + 14, OX + 6, P.Y(EXT) + 14].join(' ') }, gp);
      el('text', { 'class': 'ax', x: P.X(EXT) - 4, y: OY + 34, 'text-anchor': 'end' }, gp, 'a country');
      el('text', { 'class': 'ax', x: OX + 16, y: P.Y(EXT) + 14 }, gp, 'football');

      // ---- arrows in the plane (drawn by one function, tweened as numbers)
      var ga = $('arrows');
      function mkArrow(parent) {
        var g = el('g', {}, parent);
        return { g: g, sh: el('line', { 'class': 'sh' }, g), hd: el('polygon', {}, g) };
      }
      // state row: [tailX, tailY, tipX, tipY, opacity, cyan(0..1), width] in MATH coordinates
      function setArrow(a, s) {
        var t = P.P(s[0], s[1]), h = P.P(s[2], s[3]), dx = h[0] - t[0], dy = h[1] - t[1], len = Math.hypot(dx, dy), w = s[6];
        if (len < 3 || s[4] < 0.01) { a.g.style.opacity = 0; return; }
        a.g.style.opacity = s[4];
        var ux = dx / len, uy = dy / len, L = Math.min(8 + w * 2.4, len * 0.55), hw = L * 0.45, bx = h[0] - ux * L, by = h[1] - uy * L, c = col(s[5]);
        a.sh.setAttribute('x1', t[0]); a.sh.setAttribute('y1', t[1]);
        a.sh.setAttribute('x2', h[0] - ux * (L - 3)); a.sh.setAttribute('y2', h[1] - uy * (L - 3));
        a.sh.setAttribute('stroke', c); a.sh.setAttribute('stroke-width', w);
        a.hd.setAttribute('points', [h[0], h[1], bx - uy * hw, by + ux * hw, bx + uy * hw, by - ux * hw].join(' '));
        a.hd.setAttribute('fill', c);
      }
      // x0: the original vector, grey ghost the whole time
      var ax0 = mkArrow(ga);
      setArrow(ax0, [0, 0, X0[0], X0[1], 1, 0, 5]);
      var t0 = P.P(X0[0], X0[1]);
      el('text', { 'class': 'nm halo', x: t0[0] + 14, y: t0[1] + 40, fill: 'var(--color-text-muted)' }, ga, 'x0');
      var rowA = ROWS.map(function () { return mkArrow(ga); });
      var scA = ROWS.map(function () { return mkArrow(ga); });
      var dA = mkArrow(ga), rA = mkArrow(ga);

      // Spain marker + label
      var sp = P.P(SPAIN[0], SPAIN[1]);
      var ring = el('circle', { 'class': 'sp-ring', cx: sp[0], cy: sp[1], r: 17 }, ga);
      var splab = el('text', { 'class': 'sp-lab halo', x: sp[0] + 30, y: sp[1] + 9 }, ga, 'Spain');
      // labels that follow the arrows
      var chainLab = ROWS.map(function (r) { return el('text', { 'class': 'nm halo', fill: 'var(--color-accent)' }, ga, r[0]); });
      var dLab = el('text', { 'class': 'nm halo', 'text-anchor': 'end', fill: 'var(--color-accent)' }, ga, 'Δ');
      chainLab.forEach(function (t) { t.setAttribute('font-size', '22'); });

      // ---- the panel on the right (numbers are computed above)
      var gk = $('panel'), PX = 640, AX = 772, MX = 1046, Y0 = 122, PITCH = 74;
      el('text', { 'class': 'hdr', x: PX, y: 74 }, gk, 'rows of Wd');
      el('text', { 'class': 'hdr', x: MX, y: 74, 'text-anchor': 'end' }, gk, 'magnitude');
      el('line', { 'class': 'rule', x1: PX, y1: 90, x2: 1090, y2: 90 }, gk);
      ROWS.forEach(function (r, i) {
        var y = Y0 + i * PITCH;
        el('text', { 'class': 'rn', x: PX, y: y }, gk, r[0]);
        el('text', { 'class': 'ra c0', x: AX, y: y }, gk, arr2(r[1]));
        el('text', { 'class': 'rm', x: MX, y: y, 'text-anchor': 'end' }, gk, f2(r[2]));
        var b = el('g', { 'data-from': 1 }, gk);
        el('text', { 'class': 'rb c1', x: AX, y: y + 31 }, b, '× ' + f2(r[2]) + ' = ' + arrT(SC[i]));
      });
      el('line', { 'class': 'rule', x1: PX, y1: Y0 + 4 * PITCH - 28, x2: 1090, y2: Y0 + 4 * PITCH - 28 }, gk);
      var gd = el('g', { 'data-from': 2 }, gk);
      el('text', { 'class': 'big c2', x: PX, y: Y0 + 4 * PITCH + 8 }, gd, 'Δ = ' + arrT(D));
      var gf = el('g', { 'data-from': 3 }, gk);
      el('text', { 'class': 'big c3', x: PX, y: Y0 + 4 * PITCH + 52 }, gf, 'x0 + Δ = ' + arr2(RES));

      // ---- states per step
      function states(n) {
        var s = { arrows: [], chainOp: n === 2 ? 1 : 0, spain: n === 3 ? 1 : 0 };
        ROWS.forEach(function (r) { s.arrows.push([0, 0, r[1][0], r[1][1], n === 0 ? 1 : n === 1 ? 0.4 : 0, n === 0 ? 1 : 0, 2.5]); });
        ROWS.forEach(function (r, i) {
          if (n === 0) s.arrows.push([0, 0, 0, 0, 0, 1, 4.5]);
          else if (n === 1) s.arrows.push([0, 0, SC[i][0], SC[i][1], 1, 1, 4.5]);
          else s.arrows.push([CH[i][0], CH[i][1], CH[i + 1][0], CH[i + 1][1], n === 2 ? 1 : 0.3, n === 2 ? 1 : 0, 4.5]);
        });
        // delta: grows from the origin (step 2), then moves to the tip of x0 and stays as a grey ghost (step 3)
        s.arrows.push(n <= 1 ? [0, 0, 0, 0, 1, 1, 6.5] : n === 2 ? [0, 0, D[0], D[1], 1, 1, 6.5] : [X0[0], X0[1], X0[0] + D[0], X0[1] + D[1], 1, 0, 4.5]);
        s.arrows.push(n <= 2 ? [0, 0, X0[0], X0[1], 0, 1, 7] : [0, 0, RES[0], RES[1], 1, 1, 7]);
        s.dlabOp = n >= 2 ? 1 : 0;
        return s;
      }
      function lerpState(a, b, t) {
        return {
          arrows: a.arrows.map(function (r, i) { return Deck.lerp(r, b.arrows[i], t); }),
          // labels fade in only once the arrows have settled, and fade out first
          chainOp: Deck.lerp(a.chainOp, b.chainOp, b.chainOp > a.chainOp ? Math.max(0, 2 * t - 1) : Math.min(1, 2 * t)),
          spain: Deck.lerp(a.spain, b.spain, t),
          dlabOp: Deck.lerp(a.dlabOp, b.dlabOp, b.dlabOp > a.dlabOp ? Math.max(0, 2 * t - 1) : Math.min(1, 2 * t))
        };
      }
      var cur = states(0), cancel = null;
      function draw(s) {
        var all = rowA.concat(scA, [dA, rA]);
        all.forEach(function (a, i) { setArrow(a, s.arrows[i]); });
        // chain labels sit to the right of each stacked segment
        chainLab.forEach(function (t, i) {
          var r = s.arrows[4 + i], m = P.P((r[0] + r[2]) / 2, (r[1] + r[3]) / 2);
          t.setAttribute('x', m[0] + (i === 0 ? 18 : 26)); t.setAttribute('y', m[1] + [34, 16, 10, -4][i]);
          t.style.opacity = s.chainOp;
        });
        var d = s.arrows[8], dm = P.P((d[0] + d[2]) / 2, (d[1] + d[3]) / 2);
        dLab.setAttribute('x', dm[0] - 18); dLab.setAttribute('y', dm[1] + 4);
        dLab.style.opacity = s.dlabOp;
        ring.setAttribute('stroke', col(s.spain)); splab.setAttribute('fill', col(s.spain));
        ring.style.opacity = 0.55 + 0.45 * s.spain; splab.style.opacity = 0.55 + 0.45 * s.spain;
      }
      draw(cur);

      Deck.slide('s44-wd-shear', {
        enter: function () { cur = states(0); draw(cur); },
        step: function (n, prev, c) {
          var target = states(n);
          if (cancel) { cancel(); cancel = null; }
          if (c.instant) { cur = target; draw(cur); return; }
          var from = cur;
          cancel = Deck.tween(n === 3 ? 1300 : 850, function (t) { cur = lerpState(from, target, t); draw(cur); });
        }
      });
    })();
  </script>
</section>
