<section class="slide" id="s08-matmul-dots" data-steps="3" data-tool="matrix dot">
  <p class="kicker reveal">refresher 2</p>
  <p class="statement reveal">A matrix times a vector is one dot product per column.</p>
  <div class="stage reveal">
    <svg class="diagram" viewBox="0 0 900 420" role="img" aria-labelledby="s08-matmul-dots-t s08-matmul-dots-d">
      <title id="s08-matmul-dots-t">Matrix times vector as dot products</title>
      <desc id="s08-matmul-dots-d">The row vector one, one is multiplied by a two by two matrix. Each column of the matrix is also an arrow. The first output number is the dot product of the vector with the first column, 1.5, and the second is the dot product with the second column, 1. Together they form the new vector one point five, one.</desc>
      <defs>
        <marker id="s08-matmul-dots-ag" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto"><path d="M0,0 L15,9 L0,18 z" fill="var(--color-text-muted)"/></marker>
        <marker id="s08-matmul-dots-ad" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto"><path d="M0,0 L15,9 L0,18 z" fill="var(--color-text-faint)"/></marker>
        <marker id="s08-matmul-dots-aa" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto"><path d="M0,0 L15,9 L0,18 z" fill="var(--color-accent)"/></marker>
      </defs>

      <!-- LEFT: the algebra -->
      <text class="t mut" x="30" y="62">v</text>
      <text class="t eq" x="62" y="62">=</text>
      <text id="s08-matmul-dots-v" class="t" x="96" y="62">[ 1&#8195;1 ]</text>

      <text class="t mut" x="30" y="190">M</text>
      <text class="t eq" x="68" y="190">=</text>
      <path class="brk" d="M112 118 H98 V222 H112 M338 118 H352 V222 H338"/>
      <rect id="s08-matmul-dots-h1" class="hl" x="124" y="122" width="82" height="96" rx="10"/>
      <rect id="s08-matmul-dots-h2" class="hl" x="236" y="122" width="82" height="96" rx="10"/>
      <text class="m" x="165" y="162">1</text><text class="m" x="277" y="162">0</text>
      <text class="m" x="165" y="204">0.5</text><text class="m" x="277" y="204">1</text>
      <text id="s08-matmul-dots-l1" class="cl" x="165" y="108">c1</text>
      <text id="s08-matmul-dots-l2" class="cl" x="277" y="108">c2</text>

      <text id="s08-matmul-dots-a1" class="ar" x="30" y="282">v &middot; c1 = 1&times;1 + 1&times;0.5 = 1.5</text>
      <text id="s08-matmul-dots-a2" class="ar" x="30" y="322">v &middot; c2 = 1&times;0 + 1&times;1 = 1</text>
      <text class="t mut" x="30" y="388">v M</text>
      <text class="t eq" x="128" y="388">=</text>
      <text class="t" x="170" y="388">[</text>
      <text id="s08-matmul-dots-o1" class="t out" x="214" y="388">1.5</text>
      <text id="s08-matmul-dots-o2" class="t out" x="304" y="388">1</text>
      <text class="t" x="344" y="388">]</text>

      <!-- RIGHT: the plane -->
      <line class="axis" x1="470" y1="300" x2="860" y2="300"/>
      <line class="axis" x1="540" y1="370" x2="540" y2="60"/>
      <line id="s08-matmul-dots-sh1" class="shadow" x1="0" y1="0" x2="0" y2="0"/>
      <line id="s08-matmul-dots-sh2" class="shadow" x1="0" y1="0" x2="0" y2="0"/>
      <line id="s08-matmul-dots-c1" class="col" x1="540" y1="300" x2="0" y2="0" marker-end="url(#s08-matmul-dots-ad)"/>
      <line id="s08-matmul-dots-c2" class="col" x1="540" y1="300" x2="0" y2="0" marker-end="url(#s08-matmul-dots-ad)"/>
      <line id="s08-matmul-dots-v0" class="vec0" x1="540" y1="300" x2="0" y2="0" marker-end="url(#s08-matmul-dots-ag)"/>
      <line id="s08-matmul-dots-vo" class="vout" x1="540" y1="300" x2="0" y2="0" marker-end="url(#s08-matmul-dots-aa)"/>
      <text id="s08-matmul-dots-tv" class="pl" x="0" y="0">v</text>
      <text id="s08-matmul-dots-t1" class="pl c" x="0" y="0">c1</text>
      <text id="s08-matmul-dots-t2" class="pl c" x="0" y="0">c2</text>
      <text id="s08-matmul-dots-to" class="pl o" x="0" y="0">v M</text>
    </svg>
  </div>

  <style>
    #s08-matmul-dots svg.diagram{max-width:min(1177.6px,1040px);}
    #s08-matmul-dots .t{font-family:var(--font-mono);font-size:36px;fill:var(--color-text);}
    #s08-matmul-dots .t.mut{fill:var(--color-text-dim);}
    #s08-matmul-dots .t.eq{fill:var(--color-text-dim);}
    #s08-matmul-dots .t.out{fill:var(--color-accent);text-anchor:start;opacity:0;transition:opacity .5s ease;}
    #s08-matmul-dots .m{font-family:var(--font-mono);font-size:38px;fill:var(--color-text);text-anchor:middle;}
    #s08-matmul-dots .cl{font-family:var(--font-mono);font-size:22px;fill:var(--color-text-faint);text-anchor:middle;transition:fill .4s ease;}
    #s08-matmul-dots .brk{fill:none;stroke:var(--color-text-muted);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
    #s08-matmul-dots .hl{fill:color-mix(in oklab,var(--color-accent) 8%,transparent);stroke:var(--color-accent);stroke-width:2;opacity:0;transition:opacity .4s ease;}
    #s08-matmul-dots .ar{font-family:var(--font-mono);font-size:26px;fill:var(--color-accent);opacity:0;transition:opacity .5s ease;}
    #s08-matmul-dots .axis{stroke:var(--color-hairline);stroke-width:1.5;}
    #s08-matmul-dots .col{stroke:var(--color-text-faint);stroke-width:3.5;stroke-linecap:round;transition:stroke .4s ease;}
    #s08-matmul-dots .vec0{stroke:var(--color-text-muted);stroke-width:5;stroke-linecap:round;}
    #s08-matmul-dots .vout{stroke:var(--color-accent);stroke-width:5;stroke-linecap:round;opacity:0;transition:opacity .5s ease;}
    #s08-matmul-dots .shadow{stroke:var(--color-accent);stroke-width:2;stroke-dasharray:6 6;opacity:0;transition:opacity .4s ease;}
    #s08-matmul-dots .pl{font-family:var(--font-mono);font-size:24px;fill:var(--color-text-muted);}
    #s08-matmul-dots .pl.c{fill:var(--color-text-faint);transition:fill .4s ease;}
    #s08-matmul-dots .pl.o{fill:var(--color-accent);opacity:0;transition:opacity .5s ease;}
    
    #s08-matmul-dots.hl1 #s08-matmul-dots-h1, #s08-matmul-dots.hl2 #s08-matmul-dots-h2{opacity:1;}
    #s08-matmul-dots.hl1 #s08-matmul-dots-l1, #s08-matmul-dots.hl2 #s08-matmul-dots-l2{fill:var(--color-accent);}
    #s08-matmul-dots.hl1 #s08-matmul-dots-c1, #s08-matmul-dots.hl2 #s08-matmul-dots-c2{stroke:var(--color-accent);}
    #s08-matmul-dots.hl1 #s08-matmul-dots-t1, #s08-matmul-dots.hl2 #s08-matmul-dots-t2{fill:var(--color-accent);}
    #s08-matmul-dots.hl1 #s08-matmul-dots-sh1, #s08-matmul-dots.hl2 #s08-matmul-dots-sh2{opacity:.8;}
    #s08-matmul-dots.hl1 #s08-matmul-dots-a1, #s08-matmul-dots.s2on #s08-matmul-dots-a1{opacity:1;}
    #s08-matmul-dots.s2on #s08-matmul-dots-a2{opacity:1;}
    #s08-matmul-dots.o1 #s08-matmul-dots-o1, #s08-matmul-dots.o2 #s08-matmul-dots-o2{opacity:1;}
    #s08-matmul-dots.res #s08-matmul-dots-vo, #s08-matmul-dots.res #s08-matmul-dots-to{opacity:1;}
  </style>
  <script>
    (function () {
      var P = Deck.plane({ ox: 540, oy: 300, u: 130 });
      var v = [1, 1], M = [1, 0, 0.5, 1];
      var c1 = [M[0], M[2]], c2 = [M[1], M[3]];           // the columns of M, as arrows
      var out = Deck.vmul(v, M);                           // [v . c1, v . c2]
      function $(id) { return document.getElementById('s08-matmul-dots-' + id); }
      function arrow(el, vec) { var p = P.P(vec[0], vec[1]); el.setAttribute('x2', p[0]); el.setAttribute('y2', p[1]); }
      function label(el, vec, dx, dy) { var p = P.P(vec[0], vec[1]); el.setAttribute('x', p[0] + dx); el.setAttribute('y', p[1] + dy); }
      function shadow(el, c) {                             // dashed drop from v's tip onto the column's line
        var k = Deck.dot(v, c) / Deck.dot(c, c), a = P.P(v[0], v[1]), b = P.P(k * c[0], k * c[1]);
        el.setAttribute('x1', a[0]); el.setAttribute('y1', a[1]); el.setAttribute('x2', b[0]); el.setAttribute('y2', b[1]);
      }
      function fmt(x) { return String(Math.round(x * 100) / 100); }

      Deck.slide('s08-matmul-dots', {
        enter: function (c) {
          var root = c.el;
          arrow($('c1'), c1); arrow($('c2'), c2); arrow($('v0'), v); arrow($('vo'), out);
          label($('tv'), v, 12, -12); label($('t1'), c1, 14, 26); label($('t2'), c2, -40, 6); label($('to'), out, 14, -12);
          shadow($('sh1'), c1); shadow($('sh2'), c2);
          // the numbers shown are computed from the data above
          $('a1').textContent = 'v · c1 = ' + v[0] + '×' + c1[0] + ' + ' + v[1] + '×' + c1[1] + ' = ' + fmt(out[0]);
          $('a2').textContent = 'v · c2 = ' + v[0] + '×' + c2[0] + ' + ' + v[1] + '×' + c2[1] + ' = ' + fmt(out[1]);
          $('o1').textContent = fmt(out[0]); $('o2').textContent = fmt(out[1]);
        },
        step: function (n, prev, c) {
          var r = c.el.classList;
          r.toggle('hl1', n === 1 || n === 3);
          r.toggle('hl2', n === 2 || n === 3);
          r.toggle('s2on', n >= 2);
          r.toggle('o1', n >= 1);
          r.toggle('o2', n >= 2);
          r.toggle('res', n === 3);
        }
      });
    })();
  </script>
</section>
