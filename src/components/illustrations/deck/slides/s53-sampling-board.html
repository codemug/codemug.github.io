// Pure model for the sampling board. No DOM, no kit: the build and the page both inline this file.
//
// The machine: five fixed bins, one per token. Over each bin's mouth hangs a hinged hatch.
// A ball is dropped at a uniformly random point over a bin's mouth (bin chosen uniformly,
// then a uniform fraction v along the mouth from the hinge). The hatch of length L = mouth
// depth, raised by angle phi, covers the fraction cos(phi) of the mouth measured from the
// hinge. The ball goes in iff it lands beyond the shadow of the hatch: v > cos(phi).
// A ball that misses goes back to the hopper (rejection sampling).
// Hatch angle phi = acos(1 - r) with r = exp((z - zmax) / T), so the chance a drop over bin i
// is accepted is r_i, and the accepted balls land in bin i with probability r_i / sum(r) = softmax(z / T)_i.

const T_MIN = 0.3;
const T_MAX = 3;

const clampT = (t) => Math.min(T_MAX, Math.max(T_MIN, Number.isFinite(t) ? t : 1));

function softmax(logits, T) {
  const top = Math.max(...logits);
  const raw = logits.map((z) => Math.exp((z - top) / T));
  const sum = raw.reduce((a, b) => a + b, 0);
  return raw.map((v) => v / sum);
}

// Hatch opening per bin: the Boltzmann factor relative to the best token, in (0, 1].
function gates(logits, T) {
  const top = Math.max(...logits);
  return logits.map((z) => Math.exp((z - top) / T));
}

// Hatch angle in radians: 0 is shut (flat over the mouth), PI/2 is fully open (standing up).
const hatchAngle = (r) => Math.acos(1 - Math.min(1, Math.max(0, r)));

// Does a ball landing at fraction v (0 = at the hinge, 1 = far edge) of the mouth get in?
const passes = (v, phi) => v > Math.cos(phi);

// One physical drop: which bin it is over, and where along the mouth.
const drop = (n, rng) => ({ cell: Math.min(n - 1, Math.floor(rng() * n)), v: rng() });

// ------------------------------------------------------------ loop
const TOUR = [0.5, 1, 2, 1], DWELL = 4.2;

  if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowDown&quot;) next = lnTarget - (event.shiftKey ? 3 : 1) * step;
