<section class="slide" id="t403-not-all-knowledge" data-steps="2">
  <p class="kicker reveal">mixture of experts</p>
  <p class="statement reveal">Not all knowledge is needed for every token.</p>
  <div class="stage reveal">
    <svg class="diagram" viewBox="0 0 1120 520" role="img" aria-labelledby="t403-not-all-knowledge-t t403-not-all-knowledge-d">
      <title id="t403-not-all-knowledge-t">Only the region of the feed-forward block that holds the needed knowledge is lit</title>
      <desc id="t403-not-all-knowledge-d">A large block, the feed-forward part, is divided into six labelled regions: French, Python syntax, chess rules, kubernetes, cooking and maths. At first all are grey. Then the token le arrives and only the French region lights up in cyan. Then the token def arrives, French goes grey again and only the Python syntax region lights up.</desc>
      <text class="ff" x="1060" y="44">feed-forward</text>
      <g id="t403-not-all-knowledge-regions"></g>
      <g data-from="0" data-until="1">
        <rect class="ghostchip" x="507" y="14" width="106" height="48" rx="10"/>
        <text class="ghosttxt" x="560" y="46">token</text>
      </g>
      <g data-from="1" data-until="2" id="t403-not-all-knowledge-c1"></g>
      <g data-from="2" id="t403-not-all-knowledge-c2"></g>
    </svg>
  </div>

  <style>
    #t403-not-all-knowledge svg.diagram{width:100%;height:100%;max-width:none;}
    #t403-not-all-knowledge text{font-family:var(--font-mono);}
    #t403-not-all-knowledge .ff{font-size:22px;fill:var(--color-text-muted);text-anchor:end;}
    #t403-not-all-knowledge .reg{fill:var(--color-surface-deep);stroke:var(--color-border-strong);stroke-width:2.5;transition:fill .6s,stroke .6s;}
    #t403-not-all-knowledge .rl{font-size:28px;fill:var(--color-text-muted);text-anchor:middle;transition:fill .6s;}
    #t403-not-all-knowledge .on .reg{fill:color-mix(in oklab,var(--color-accent) 14%,var(--color-surface-deep));stroke:var(--color-accent);stroke-width:3.5;}
    #t403-not-all-knowledge .on .rl{fill:var(--color-accent);font-weight:600;}
    #t403-not-all-knowledge .tchip{fill:var(--color-surface-deep);stroke:var(--color-accent);stroke-width:3;}
    #t403-not-all-knowledge .ct{font-size:34px;fill:var(--color-text);text-anchor:middle;}
    #t403-not-all-knowledge .sp{fill:var(--color-accent);}
    #t403-not-all-knowledge .ay{fill:none;stroke:var(--color-accent);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;}
    #t403-not-all-knowledge .ghostchip{fill:none;stroke:var(--color-text-faint);stroke-width:2;stroke-dasharray:7 6;}
    #t403-not-all-knowledge .ghosttxt{font-size:22px;fill:var(--color-text-dim);text-anchor:middle;}
  </style>

  <script>
    (function () {
      var ID = 't403-not-all-knowledge';
      var NS = 'http://www.w3.org/2000/svg';
      function $(s) { return document.getElementById(ID + '-' + s); }
      function el(tag, attrs, parent, text) {
        var e = document.createElementNS(NS, tag);
        Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
        if (text !== undefined) e.textContent = text;
        if (parent) parent.appendChild(e);
        return e;
      }
      // TOY regions: [label, x, y, width, height]; the block is 1000 x 368 at (60, 104)
      var R = [
        ['French', 60, 104, 330, 210], ['Python syntax', 400, 104, 380, 210], ['chess rules', 790, 104, 270, 210],
        ['kubernetes', 60, 324, 300, 148], ['cooking', 370, 324, 320, 148], ['maths', 700, 324, 360, 148]
      ];
      var gr = $('regions'), regs = [];
      R.forEach(function (r) {
        var g = el('g', {}, gr);
        el('rect', { 'class': 'reg', x: r[1], y: r[2], width: r[3], height: r[4], rx: 16 }, g);
        el('text', { 'class': 'rl', x: r[1] + r[3] / 2, y: r[2] + r[4] / 2 + 10 }, g, r[0]);
        regs.push(g);
      });

      // token chip: a leading space is drawn as a cyan dot (as on the tokenizer slide)
      var FS = 34, ADV = FS * 0.6, PAD = 22, CH = 48;
      function chip(parent, cx, text) {
        var lead = text.charAt(0) === ' ', body = lead ? text.slice(1) : text;
        var inner = (lead ? ADV : 0) + body.length * ADV, w = inner + 2 * PAD;
        el('rect', { 'class': 'tchip', x: cx - w / 2, y: 14, width: w, height: CH, rx: 10 }, parent);
        if (lead) el('circle', { 'class': 'sp', cx: cx - inner / 2 + ADV / 2, cy: 14 + CH / 2 + 4, r: FS * 0.11 }, parent);
        el('text', { 'class': 'ct', x: cx + (lead ? ADV : 0) / 2, y: 14 + CH / 2 + 12 }, parent, body);
        el('path', { 'class': 'ay', d: 'M' + cx + ' 68V96m-9 -11l9 11l9 -11' }, parent);
      }
      chip($('c1'), R[0][1] + R[0][3] / 2, ' le');          // lights French
      chip($('c2'), R[1][1] + R[1][3] / 2, 'def');          // lights Python syntax

      function paint(n) {
        regs.forEach(function (g, i) {
          var on = (n === 1 && i === 0) || (n === 2 && i === 1);
          g.setAttribute('class', on ? 'on' : '');
        });
      }
      paint(0);

      Deck.slide('t403-not-all-knowledge', {
        enter: function () { paint(0); },
        step: function (n) { paint(n); }
      });
    })();
  </script>
</section>
