<section class="slide" id="d501-run-simulation" data-steps="8">
  <p class="kicker reveal">endpoint picker</p>
  <p class="statement reveal">Prefix pulls requests together, load pushes them apart.</p>
  <div class="stage reveal">
    <svg class="diagram" viewBox="0 0 1120 520" role="img" aria-labelledby="d501-run-simulation-t d501-run-simulation-d">
      <title id="d501-run-simulation-t">A stream of eight requests routed over three simulated vLLM pods by the endpoint picker</title>
      <desc id="d501-run-simulation-d">Built-in default weights queue 2, KV 2, prefix 3; pods with queue 5 or more or KV 0.8 or more are filtered out first. Pods A, B and C start with queue 2 each and KV 0.20, 0.40 and 0.50. Request 1, shared prompt: A 3.60, B 3.20, C 3.00, goes to A. Request 2, unique prompt: A 1.12, B 3.20, C 3.00, goes to B. Request 3, shared prompt: A 3.37, B 0.96, C 3.00, goes to A. Request 4, shared prompt: A 3.25, B 1.96, C 3.00, goes to A. Request 5, unique prompt: A 0.88, B 2.29, C 3.00, goes to C. Request 6, shared prompt: A 3.13, B 2.96, C 2.76, goes to A. Request 7, shared prompt: A 3.01, B 2.96, C 2.76, goes to A. Request 8, shared prompt: B 2.96, C 2.76 (A filtered out), goes to B. Pod A takes requests 1, 3, 4, 6 and 7 and reaches queue 5; request 8 goes to B, which then also caches the shared prompt. Toy rules: a routed request adds 1 to the queue and 0.03 KV per new block, and every third arrival each pod finishes one request.</desc>
      <g id="d501-run-simulation-g"></g>
    </svg>
  </div>

      // ---- state of pod p seen at step n, progress k (0..1); pre = before the arrival tick, mid = at arrival, post = after routing
      function podView(name, n, k) {

        }
        var sent = [];
        for (var m = 0; m < n - 1; m++) if (DATA.reqs[m].pick === name) sent.push(m + 1);
        if (req.pick === name && k >= 0.8) sent.push(n);
        return { q: q, kv: kv, qShown: qShown, otShown: otShown, slots: slots, sent: sent };

      function drawTop(n, k) {
        var req = DATA.reqs[n - 1];
        var out = 1 - ramp(k, 0.0, 0.10), inn = ramp(k, 0.10, 0.24);
        var prev = n > 1 ? DATA.reqs[n - 2] : null;
        var cur = k < 0.10 && prev ? prev : req;
        var vis = k < 0.10 ? (prev ? out : 0) : inn;
        reqLabel.textContent = 'request ' + cur.n + '/' + NREQ;
        reqLabel.setAttribute('opacity', vis.toFixed(3));
        for (var b = 0; b < 8; b++) {
          var has = b < cur.blocks;
          reqSq[b].setAttribute('opacity', (has ? vis : 0).toFixed(3));
          reqSq[b].setAttribute('class', b < cur.nshared ? 'sqs' : 'sq');
        }
        reqKind.textContent = cur.kindText;
        reqKind.setAttribute('opacity', vis.toFixed(3));
      }

      function drawStatus(n, k) {
        var req = DATA.reqs[n - 1];
        var prev = n > 1 ? DATA.reqs[n - 2].status : DATA.intro;
        status.textContent = k < 0.15 ? prev : req.status;
        status.setAttribute('opacity', (k < 0.15 ? 1 - ramp(k, 0.0, 0.15) : ramp(k, 0.5, 0.66)).toFixed(3));
      }

      function draw(n, k) {
        if (n === 0) {
          reqLabel.textContent = DATA.reqs.length + ' requests will arrive';
          reqLabel.setAttribute('opacity', 1);
          reqSq.forEach(function (s) { s.setAttribute('opacity', 0); });
          reqKind.setAttribute('opacity', 0);
          rows.forEach(function (r, i) {
            r.cells.setAttribute('opacity', 0); r.warn.setAttribute('opacity', 0); r.hi.setAttribute('opacity', 0);
            r.g.setAttribute('class', ''); r.ln.setAttribute('class', 'ln'); r.hd.setAttribute('class', 'hd');
            r.arrow.setAttribute('opacity', 1); r.dot.setAttribute('opacity', 0); r.rule.setAttribute('opacity', 1);
            var s0 = DATA.start[PODS[i]];
            drawPod(r, { q: s0.q, kv: s0.kv, qShown: s0.q, otShown: s0.ot, slots: [0, 0, 0, 0, 0, 0], sent: [] });
          });
          status.textContent = DATA.intro;
          status.setAttribute('opacity', 1);
          return;
        }
        drawTop(n, k);
        drawRows(n, k);
        rows.forEach(function (r, i) { drawPod(r, podView(PODS[i], n, k)); });
        drawStatus(n, k);
      }
      draw(0, 1);

      var cancel = null;
      Deck.slide('d501-run-simulation', {
        enter: function () { if (cancel) { cancel(); cancel = null; } draw(0, 1); },
        step: function (n, prev, c) {
          if (cancel) { cancel(); cancel = null; }
          if (c.instant || n === 0 || n < prev) { draw(n, 1); return; }
          draw(n, 0);
          cancel = Deck.tween(1500, function (k) { draw(n, k); }, { ease: Deck.ease.linear });
        }
      });
    })();
  </script>
