<section class="slide" id="t602-redo-everything" data-steps="2">
  <p class="kicker reveal">kv cache</p>
  <p class="statement reveal">Taken literally, every step redoes everything.</p>
  <div class="stage reveal">
    <svg class="diagram" viewBox="0 0 1120 520" role="img" aria-labelledby="t602-redo-everything-t t602-redo-everything-d">
      <title id="t602-redo-everything-t">Every loop iteration recomputes q, k and v for all the earlier tokens</title>
      <desc id="t602-redo-everything-d">A work grid with one column per loop iteration and one row per token. Each cell stands for the q, k and v of one token. Iteration 1 computes 18 cells, all new and cyan. Iteration 2 has 19 cells: 18 grey cells that are the same as before and one new cyan cell. Iteration 3 has 20 cells: 19 grey and one cyan. A counter of tokens recomputed rises from 0 to 18 and then to 37.</desc>
      <g id="t602-redo-everything-grid"></g>
      <g id="t602-redo-everything-heads"></g>
      <g id="t602-redo-everything-legend">
        <rect class="lg" x="800" y="64" width="56" height="44" rx="8"/><text class="lgt" x="828" y="86" dy=".35em">q</text>
        <rect class="lg" x="864" y="64" width="56" height="44" rx="8"/><text class="lgt" x="892" y="86" dy=".35em">k</text>
        <rect class="lg" x="928" y="64" width="56" height="44" rx="8"/><text class="lgt" x="956" y="86" dy=".35em">v</text>
        <text class="lgc" x="800" y="142">of one token = one cell</text>
        <rect class="swn" x="800" y="190" width="24" height="24" rx="5"/>
        <text class="lgc" x="836" y="202" dy=".35em">new</text>
        <rect class="swg" x="800" y="236" width="24" height="24" rx="5"/>
        <text class="lgc" x="836" y="248" dy=".35em">same as before</text>
      </g>
      <text id="t602-redo-everything-big" class="big" x="800" y="384">0</text>
      <text class="bigl" x="800" y="426">tokens recomputed</text>
    </svg>
  </div>

  <style>
    #t602-redo-everything svg.diagram{width:100%;height:100%;max-width:none;}
    #t602-redo-everything text{font-family:var(--font-mono);}
    #t602-redo-everything .head{font-size:22px;text-anchor:middle;}
    #t602-redo-everything .cnt{font-size:24px;text-anchor:middle;fill:var(--color-text-muted);}
    #t602-redo-everything .lg{fill:var(--color-surface-deep);stroke:var(--color-border-strong);stroke-width:2;}
    #t602-redo-everything .lgt{font-size:24px;fill:var(--color-text-muted);text-anchor:middle;}
    #t602-redo-everything .lgc{font-size:22px;fill:var(--color-text-muted);}
    #t602-redo-everything .swn{fill:var(--color-accent);}
    #t602-redo-everything .swg{fill:var(--color-text-faint);}
    #t602-redo-everything .big{font-size:88px;font-weight:700;fill:var(--color-accent);}
    #t602-redo-everything .bigl{font-size:24px;fill:var(--color-text-muted);}
  </style>

  <script>
    (function () {
      var ID = 't602-redo-everything';
      var root = document.getElementById(ID);
      var svg = root.querySelector('svg.diagram');
      var NS = svg.namespaceURI;
      // REAL: deck/data/part2.json gandalf.steps[0].n_tokens = 18; the next two prefixes have 19 and 20 tokens
      var N = 18, COLS = 3;
      var X0 = 70, CPITCH = 226, SEG = 52, SGAP = 7, Y0 = 62, RP = 19, RH = 15;
      var CY = Deck.rgb('--color-accent'), MUT = Deck.rgb('--color-text-muted'), FAINT = Deck.rgb('--color-text-faint');

      function el(tag, attrs, parent, text) {
        var e = document.createElementNS(NS, tag);
        Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
        if (text !== undefined) e.textContent = text;
        if (parent) parent.appendChild(e);
        return e;
      }
      function clamp(v) { return Math.max(0, Math.min(1, v)); }
      function mix(a, b, t) { t = clamp(t); return 'rgb(' + a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); }).join(',') + ')'; }

      var gGrid = root.querySelector('#' + ID + '-grid'), gHeads = root.querySelector('#' + ID + '-heads');
      var cols = [], c, r, s;
      for (c = 0; c !== COLS; c++) {
        var n = N + c, cx = X0 + c * CPITCH, col = { n: n, cells: [] };
        for (r = 0; r !== n; r++) {
          var g = el('g', {}, gGrid), segs = [];
          for (s = 0; s !== 3; s++) segs.push(el('rect', { x: cx + s * (SEG + SGAP), y: Y0 + r * RP, width: SEG, height: RH, rx: 3 }, g));
          col.cells.push({ g: g, segs: segs });
        }
        col.head = el('text', { 'class': 'head', x: cx + 85, y: 38 }, gHeads, 'iteration ' + (c + 1));
        col.count = el('text', { 'class': 'cnt', x: cx + 85, y: Y0 + 20 * RP + 36 }, gHeads, n + ' tokens');
        cols.push(col);
      }
      var big = root.querySelector('#' + ID + '-big');

      var S = 0, cancel = null;    // S: 0 = iteration 1 only, 1 = + iteration 2, 2 = + iteration 3 (fractional while animating)
      function draw() {
        var total = Math.round(N * clamp(S) + (N + 1) * clamp(S - 1));
        cols.forEach(function (col, ci) {
          var p = ci === 0 ? 1 : clamp(S - (ci - 1));
          var act = ci === 0 ? 1 - clamp(S) : p * (1 - clamp(S - ci));       // the iteration that was just added is cyan
          col.head.style.opacity = ci === 0 ? 1 : clamp(p * 5);
          col.count.style.opacity = col.head.style.opacity;
          col.head.style.fill = mix(MUT, CY, act);
          col.cells.forEach(function (cell, ri) {
            var isNew = ci === 0 || ri === col.n - 1, a;
            if (ci === 0) a = 1;
            else if (isNew) a = clamp((p - 0.8) / 0.2);
            else a = clamp((p - 0.55 * ri / (col.n - 1)) / 0.3);
            cell.g.style.opacity = a;
            cell.segs.forEach(function (sg) { sg.style.fill = isNew ? mix(FAINT, CY, 1) : mix(FAINT, FAINT, 1); });
          });
        });
        big.textContent = String(total);
      }
      draw();

      Deck.slide('t602-redo-everything', {
        enter: function () { S = 0; draw(); },
        step: function (n, prev, c) {
          if (cancel) { cancel(); cancel = null; }
          if (c.instant) { S = n; draw(); return; }
          var from = S;
          cancel = Deck.tween(1100, function (t) { S = Deck.lerp(from, n, t); draw(); });
        }
      });
    })();
  </script>
</section>
