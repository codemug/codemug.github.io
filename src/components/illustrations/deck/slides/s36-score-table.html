<section class="slide" id="s36-score-table" data-steps="4" data-tool="dot">
  <p class="kicker reveal">attention</p>
  <p class="statement reveal">q · k: how strongly one token is influenced by another.</p>
  <div class="stage reveal">
    <svg class="diagram" viewBox="0 0 1120 520" role="img" aria-labelledby="s36-score-table-t s36-score-table-d">
      <title id="s36-score-table-t">Query times key scores as a table and as arrows</title>
      <desc id="s36-score-table-d">On the left, a table with the keys tar, odd, golf, ball one, ball two and balls as rows and the queries of ball one, ball two and balls as columns. Each cell is the dot product of a query and a key. On the right, the same keys as grey arrows in a plane with the selected query as a cyan arrow. For each query the key with the highest dot product lights up: tar for the first ball, odd for the second ball, golf for balls.</desc>
    </svg>
  </div>

  <style>
    #s36-score-table .statement{max-width:1120px;}
    #s36-score-table svg.diagram{width:100%;height:100%;max-width:none;}
    #s36-score-table text{font-family:var(--font-mono);}
    #s36-score-table .grd{stroke:var(--color-hairline);stroke-width:1;}
    #s36-score-table .axl{stroke:var(--color-text-faint);stroke-width:2;}
    #s36-score-table .axh{fill:var(--color-text-faint);}
    #s36-score-table .halo{paint-order:stroke;stroke:var(--color-bg);stroke-width:7px;stroke-linejoin:round;}
    #s36-score-table .sh{stroke:currentColor;fill:none;stroke-linecap:round;}
    #s36-score-table .hd{fill:currentColor;stroke:none;}
    #s36-score-table .nm{font-size:22px;font-weight:600;}
    #s36-score-table .tag{font-size:20px;fill:var(--color-text-dim);text-anchor:middle;}
    #s36-score-table .chiprect{fill:var(--color-surface-deep);stroke:var(--color-border-strong);stroke-width:2;}
    #s36-score-table .chipt{font-size:22px;text-anchor:middle;}
    #s36-score-table .cellbg{fill:var(--color-surface-deep);stroke:var(--color-hairline);stroke-width:1;}
    #s36-score-table .cellt{font-size:24px;text-anchor:middle;font-variant-numeric:tabular-nums;}
    #s36-score-table .colbg{fill:var(--color-accent);stroke:var(--color-accent);stroke-width:1.5;}
    #s36-score-table .ring{fill:none;stroke:var(--color-accent);stroke-width:3;}
    #s36-score-table .hdr{font-size:22px;text-anchor:middle;font-weight:600;}
    #s36-score-table .calc{font-size:20px;fill:var(--color-accent);}
  </style>

  <script>
    (function () {
      var root = document.getElementById('s36-score-table');
      var svg = root.querySelector('svg.diagram');
      var NS = svg.namespaceURI;
      // the attention plane: SAME origin, scale and orientation on s33 to s39
      var OX = 752, OY = 332, U = 240, X0 = -1.1, X1 = 1.4, Y0 = -0.5, Y1 = 1.1;
      var P = Deck.plane({ ox: OX, oy: OY, u: U });
      // ATTENTION TOY
      var QN = ['ball#1', 'ball#2', 'balls'];
      var Q = [[0.95, 0.10], [0.10, 0.95], [-0.80, 0.55]];
      var KN = ['tar', 'odd', 'golf', 'ball#1', 'ball#2', 'balls'];
      var K = [[0.90, 0.15], [0.15, 0.90], [-0.85, 0.50], [0.10, -0.20], [-0.10, 0.05], [0.05, 0.10]];
      var S = Q.map(function (q) { return K.map(function (k) { return Deck.dot(q, k); }); });   // S[col][row]
      var WIN = S.map(function (c) { return c.indexOf(Math.max.apply(null, c)); });             // best key of each query
      // label placement for the plane: offsets from the tip
      var KLAB = [[0, -24, 'middle'], [28, 6, 'start'], [-14, 24, 'end'], [14, 8, 'start'], [-14, 32, 'end'], [10, -14, 'start']];
      var QLAB = [[14, 44, 'end'], [-18, -4, 'end'], [-14, -22, 'start']];

      var CY = Deck.rgb('--color-accent'), SOFT = Deck.rgb('--color-text-soft'), MUT = Deck.rgb('--color-text-muted'), DIM = Deck.rgb('--color-text-dim'), WHITE = Deck.rgb('--color-text');
      function mixv(a, b, t) { t = Math.max(0, Math.min(1, t)); return a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); }); }
      function mix(a, b, t) { return 'rgb(' + mixv(a, b, t).join(',') + ')'; }

      function el(tag, attrs, parent, text) {
        var e = document.createElementNS(NS, tag);
        Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
        if (text !== undefined) e.textContent = text;
        if (parent) parent.appendChild(e);
        return e;
      }
      // half-up rounding so the toy numbers print as in the spec (0.075 -> 0.08, 0.955 -> 0.96)
      function f2(x) { var r = Math.round(Math.abs(x) * 100 + 1e-7) / 100; return (x < 0 && r > 0 ? '−' : '') + r.toFixed(2); }
      function wrap(x) { return x < 0 ? '(' + f2(x) + ')' : f2(x); }

      function buildPlane() {
        var g = el('g', {}, svg), k, j;
        for (k = -1; k <= 1.4; k += 0.5) if (Math.abs(k) > 1e-9) el('line', { 'class': 'grd', x1: P.X(k), y1: P.Y(Y0), x2: P.X(k), y2: P.Y(Y1) }, g);
        for (j = -0.5; j <= 1.1; j += 0.5) if (Math.abs(j) > 1e-9) el('line', { 'class': 'grd', x1: P.X(X0), y1: P.Y(j), x2: P.X(X1), y2: P.Y(j) }, g);
        el('line', { 'class': 'axl', x1: P.X(X0), y1: OY, x2: P.X(X1) - 8, y2: OY }, g);
        el('line', { 'class': 'axl', x1: OX, y1: P.Y(Y0), x2: OX, y2: P.Y(Y1) + 8 }, g);
        [[P.X(X1), OY, -1, 0], [OX, P.Y(Y1), 0, 1]].forEach(function (h) {
          var bx = h[0] + h[2] * 14, by = h[1] + h[3] * 14, nx = -h[3] * 6, ny = h[2] * 6;
          el('polygon', { 'class': 'axh', points: [h[0], h[1], bx + nx, by + ny, bx - nx, by - ny].join(' ') }, g);
        });
      }
      // arrow from the origin; shaft and head are redrawn on every call; colour is set from script
      function arrow(parent, w, L0, hw) {
        var g = el('g', {}, parent);
        var shaft = el('line', { 'class': 'sh', 'stroke-width': w }, g);
        var head = el('polygon', { 'class': 'hd' }, g);
        return {
          g: g,
          set: function (v, alpha, col) {
            var t = P.P(v[0], v[1]), dx = t[0] - OX, dy = t[1] - OY, len = Math.hypot(dx, dy);
            g.style.opacity = len < 3 ? 0 : alpha;
            g.style.color = col;
            if (len < 3) return;
            var ux = dx / len, uy = dy / len, L = Math.min(L0, len * 0.55), bx = t[0] - ux * L, by = t[1] - uy * L;
            shaft.setAttribute('x1', OX); shaft.setAttribute('y1', OY);
            shaft.setAttribute('x2', t[0] - ux * (L - 2)); shaft.setAttribute('y2', t[1] - uy * (L - 2));
            head.setAttribute('points', [t[0], t[1], bx - uy * hw, by + ux * hw, bx + uy * hw, by - ux * hw].join(' '));
          }
        };
      }

      buildPlane();

      // ---------------- the table (left) ----------------
      var COLX = [190, 300, 410], ROWY = [136, 192, 248, 304, 360, 416], HY = 84, TY = 46, CHX = 72;
      var gt = el('g', {}, svg);
      el('text', { 'class': 'tag', x: CHX, y: TY }, gt, 'keys');
      el('text', { 'class': 'tag', x: COLX[1], y: TY }, gt, 'queries');
      var colbg = COLX.map(function (cx) { return el('rect', { 'class': 'colbg', x: cx - 56, y: HY - 30, width: 112, height: ROWY[5] + 28 - (HY - 30), rx: 12 }, gt); });
      var hdr = QN.map(function (n, c) { return el('text', { 'class': 'hdr', x: COLX[c], y: HY }, gt, n); });
      var rowChip = KN.map(function (n, r) {
        el('rect', { 'class': 'chiprect', x: CHX - 52, y: ROWY[r] - 21, width: 104, height: 42, rx: 10 }, gt);
        el('rect', { 'class': 'chiprect', x: CHX - 52, y: ROWY[r] - 21, width: 104, height: 42, rx: 10, style: 'fill:none;stroke:var(--color-accent);opacity:0' }, gt);
        return { box: gt.lastChild, t: el('text', { 'class': 'chipt', x: CHX, y: ROWY[r] + 7 }, gt, n) };
      });
      var cell = [], ring = [];
      QN.forEach(function (n, c) {
        cell[c] = [];
        KN.forEach(function (k, r) {
          el('rect', { 'class': 'cellbg', x: COLX[c] - 50, y: ROWY[r] - 22, width: 100, height: 44, rx: 9 }, gt);
          cell[c][r] = el('text', { 'class': 'cellt', x: COLX[c], y: ROWY[r] + 8 }, gt, '');
        });
        ring[c] = el('rect', { 'class': 'ring', x: COLX[c] - 53, y: ROWY[WIN[c]] - 25, width: 106, height: 50, rx: 11 }, gt);
      });
      // the arithmetic of the winning cell, one line per step
      var calc = QN.map(function (n, c) {
        var q = Q[c], k = K[WIN[c]];
        return el('text', { 'class': 'calc', x: 20, y: 490, 'data-from': c + 1, 'data-until': c + 2 }, gt,
          wrap(q[0]) + '×' + wrap(k[0]) + ' + ' + wrap(q[1]) + '×' + wrap(k[1]) + ' = ' + f2(S[c][WIN[c]]));
      });

      // ---------------- the plane (right) ----------------
      var gp = el('g', {}, svg);
      var qA = Q.map(function () { return arrow(gp, 5.5, 24, 11); });
      var kA = K.map(function () { return arrow(gp, 3.5, 17, 7.5); });
      var kT = K.map(function (k, i) {
        var t = P.P(k[0], k[1]);
        return el('text', { 'class': 'nm halo', x: t[0] + KLAB[i][0], y: t[1] + KLAB[i][1], 'text-anchor': KLAB[i][2] }, gp, KN[i]);
      });
      var kR = K.map(function (k) { var t = P.P(k[0], k[1]); return el('circle', { 'class': 'ring', cx: t[0], cy: t[1], r: 16 }, gp); });
      var qT = Q.map(function (q, i) {
        var t = P.P(q[0], q[1]);
        return el('text', { 'class': 'nm halo', x: t[0] + QLAB[i][0], y: t[1] + QLAB[i][1], 'text-anchor': QLAB[i][2], style: 'font-size:24px' }, gp, 'q(' + QN[i] + ')');
      });

      // ---------------- state, per step ----------------
      // fill: how far each column has been computed; act: the column being looked at; tr: winner ring in the table;
      // qa: query arrow amount; kl: key lit (the winner key of the active query)
      function target(n) {
        var fill = [n >= 1 ? 1 : 0, n >= 2 ? 1 : 0, n >= 3 ? 1 : 0];
        var act = [n === 1 ? 1 : 0, n === 2 ? 1 : 0, n === 3 ? 1 : 0];
        var tr = n === 4 ? [1, 1, 1] : [n === 1 ? 1 : (n > 1 ? 0.4 : 0), n === 2 ? 1 : (n > 2 ? 0.4 : 0), n === 3 ? 1 : 0];
        var qa = n === 4 ? [1, 1, 1] : act.slice();
        var kl = [0, 0, 0, 0, 0, 0];
        WIN.forEach(function (w, c) { kl[w] = Math.max(kl[w], n === 4 ? 1 : act[c]); });
        return { fill: fill, act: act, tr: tr, qa: qa, kl: kl };
      }
      var st = target(0), cancel = null;

      function draw() {
        QN.forEach(function (n, c) {
          colbg[c].style.opacity = 0.07 * st.act[c];
          colbg[c].style.strokeOpacity = st.act[c] * 0.7;
          hdr[c].style.fill = mix(MUT, CY, st.act[c]);
          ring[c].style.opacity = st.tr[c];
          KN.forEach(function (k, r) {
            var win = r === WIN[c], t = cell[c][r], f = st.fill[c];
            t.textContent = f < 0.02 ? '' : f2(S[c][r] * f);
            t.style.fill = win ? mix(mixv(SOFT, CY, st.act[c]), CY, st.tr[c]) : mix(SOFT, CY, st.act[c]);
            t.style.fontWeight = win && st.tr[c] > 0.5 ? 600 : 400;
          });
        });
        K.forEach(function (k, i) {
          var l = st.kl[i];
          kA[i].set(k, 1, mix(DIM, WHITE, l));
          kT[i].style.fill = mix(MUT, CY, l);
          kR[i].style.opacity = l;
          rowChip[i].box.style.opacity = l;
          rowChip[i].t.style.fill = mix(SOFT, CY, l);
        });
        Q.forEach(function (q, c) {
          qA[c].set(Deck.lerp([0, 0], q, st.qa[c]), Math.min(1, st.qa[c] * 10), mix(CY, CY, 1));
          qT[c].style.opacity = Math.min(1, Math.max(0, (st.qa[c] - 0.6) / 0.4));
          qT[c].style.fill = mix(CY, CY, 1);
        });
      }
      draw();

      Deck.slide('s36-score-table', {
        enter: function () { st = target(0); draw(); },
        step: function (n, prev, c) {
          var to = target(n);
          if (cancel) { cancel(); cancel = null; }
          if (c.instant) { st = to; draw(); return; }
          var from = st;
          cancel = Deck.tween(850, function (t) {
            st = { fill: Deck.lerp(from.fill, to.fill, t), act: Deck.lerp(from.act, to.act, t), tr: Deck.lerp(from.tr, to.tr, t), qa: Deck.lerp(from.qa, to.qa, t), kl: Deck.lerp(from.kl, to.kl, t) };
            draw();
          });
        }
      });
    })();
  </script>
</section>
