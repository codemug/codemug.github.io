<section class="slide" id="s19-embedding-table" data-steps="3" data-tool="matrix">
  <p class="kicker reveal">embeddings</p>
  <p class="statement reveal">Each token number is a row in a huge table.</p>
  <div class="stage reveal">
    <svg class="diagram" viewBox="0 0 1140 540" role="img" aria-labelledby="s19-embedding-table-t s19-embedding-table-d">
      <title id="s19-embedding-table-t">The embedding table of Qwen3.8-27B: one row per token number</title>
      <desc id="s19-embedding-table-d">Eight token chips with their real ids 40, 628, 6549, 2752, 10204, 436, 10673 and 82. Below them a huge heat-grid table of 248,320 rows by 5,120 columns, rows ordered by id. Each chip drops a line to its own row. Row 628 then lifts out as a long strip showing its first eight real numbers.</desc>

      <g id="s19-embedding-table-tbl" class="tbl"></g>
      <g id="s19-embedding-table-hl" class="hl"></g>
      <g id="s19-embedding-table-card" class="card-g"></g>
      <g id="s19-embedding-table-chips" class="chips"></g>
    </svg>
  </div>

  <style>
    #s19-embedding-table svg.diagram{width:auto;height:100%;max-width:100%;}
    #s19-embedding-table text{font-family:var(--font-mono);}
    #s19-embedding-table .cell{fill:var(--color-accent);}
    #s19-embedding-table .gl{font-size:20px;fill:var(--color-text-muted);text-anchor:end;}
    #s19-embedding-table .gap .gl{fill:var(--color-text-faint);}
    #s19-embedding-table .hdr{font-size:17px;fill:var(--color-text-dim);text-anchor:end;}
    #s19-embedding-table .brk{fill:none;stroke:var(--color-text-dim);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    #s19-embedding-table .brk-lab{font-size:20px;fill:var(--color-text-muted);text-anchor:middle;}
    #s19-embedding-table .cap1{font-size:20px;fill:var(--color-text-muted);text-anchor:middle;}
    #s19-embedding-table .cap2{font-size:19px;fill:var(--color-text-dim);text-anchor:middle;}
    #s19-embedding-table .cap2 tspan{fill:var(--color-text);}
    #s19-embedding-table .ol{fill:none;stroke:var(--color-accent);stroke-width:1.8;}
    #s19-embedding-table .drop{stroke:var(--color-accent);stroke-width:2;fill:none;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);}
    #s19-embedding-table .pin{fill:var(--color-accent);}
    #s19-embedding-table .chip-box{fill:var(--color-surface-deep);stroke:var(--color-border-strong);stroke-width:1.5;}
    #s19-embedding-table .chip-txt{font-size:20px;fill:var(--color-text);text-anchor:middle;}
    #s19-embedding-table .chip-id{font-size:20px;fill:var(--color-accent);text-anchor:middle;}
    #s19-embedding-table .card-bg{fill:var(--color-bg);stroke:var(--color-border-strong);stroke-width:1.5;}
    #s19-embedding-table .strip{fill:var(--color-surface-deep);stroke:var(--color-accent);stroke-width:2.2;}
    #s19-embedding-table .sep{stroke:var(--color-accent);stroke-width:1;opacity:.3;}
    #s19-embedding-table .sn{font-size:18px;fill:var(--color-accent);text-anchor:middle;}
    #s19-embedding-table .sdots{font-size:22px;fill:var(--color-text-muted);text-anchor:middle;}
    #s19-embedding-table .clab{font-size:22px;fill:var(--color-accent);}
    #s19-embedding-table .clab tspan{fill:var(--color-text-muted);}
    #s19-embedding-table .clab tspan.w{fill:var(--color-text);}

    
    #s19-embedding-table .tbl{opacity:0;}
    #s19-embedding-table .row{opacity:.8;}
    #s19-embedding-table .ol, #s19-embedding-table .pin{opacity:0;}
    #s19-embedding-table .chips{transform-origin:610px 22px;transform:translate(-40px,205px) scale(1.15);}

    
    #s19-embedding-table.ge1 .tbl{opacity:1;}
    #s19-embedding-table.ge1 .chips{transform:none;}
    
    #s19-embedding-table.ge2 .ol, #s19-embedding-table.ge2 .pin{opacity:1;}
    #s19-embedding-table.ge2 .drop{stroke-dashoffset:0;}
    #s19-embedding-table.ge2 .row.lit{opacity:1;}
    #s19-embedding-table.ge2 .row.lit .gl{fill:var(--color-accent);}
    #s19-embedding-table.ge2 .row.gap{opacity:.28;}
    
    #s19-embedding-table.ge3 .row, #s19-embedding-table.ge3 .row.lit, #s19-embedding-table.ge3 .row.gap{opacity:.14;}
    #s19-embedding-table.ge3 .ol, #s19-embedding-table.ge3 .pin, #s19-embedding-table.ge3 .drop{opacity:.14;}
    #s19-embedding-table.ge3 .keep{opacity:1;}
    #s19-embedding-table.ge3 .chip{opacity:.3;}
    #s19-embedding-table.ge3 .chip.keep{opacity:1;}
    #s19-embedding-table.ge3 .foot{opacity:.35;}
    #s19-embedding-table.ge3 .gl, #s19-embedding-table.ge3 .row.lit .gl, #s19-embedding-table.ge3 .hdr{opacity:0;}

    @media (prefers-reduced-motion:no-preference){
      #s19-embedding-table .tbl{transition:opacity .8s ease .25s;}
      #s19-embedding-table .row, #s19-embedding-table .chip, #s19-embedding-table .foot, #s19-embedding-table .gl, #s19-embedding-table .hdr{transition:opacity .8s ease;}
      #s19-embedding-table .chips{transition:transform .9s cubic-bezier(.45,0,.25,1);}
      #s19-embedding-table .drop{transition:stroke-dashoffset .8s cubic-bezier(.45,0,.25,1) var(--d,0s),opacity .8s ease;}
      #s19-embedding-table .ol, #s19-embedding-table .pin{transition:opacity .6s ease;}
      
      #s19-embedding-table.ge2:not(.ge3) .ol{transition-delay:calc(var(--d,0s) + .5s);}
      #s19-embedding-table.ge2:not(.ge3) .pin{transition-delay:calc(var(--d,0s) + .6s);}
    }
  </style>
  <script>
    (function () {
      var ID = 's19-embedding-table', NS = 'http://www.w3.org/2000/svg';
      var NC = 24, GX0 = 150, GW = 920, CP = GW / NC, TOP = 80, RP = 22;

      /* REAL values, copied from deck/data/qwen38.json: embedding_rows[id].first16 and embedding_full["628"] (first 24) */
      var REAL = {
        40: [-0.0212, -0.009, 0.014, 0.0085, -0.0012, 0.0012, 0.0005, -0.0033, -0.0069, -0.0017, -0.0079, 0.0019, -0.0053, 0.0025, -0.0166, 0.0029],
        82: [-0.0383, 0.0112, 0.0019, 0.0085, -0.0058, 0.0035, -0.0153, 0.0001, 0.0117, 0.0051, -0.0165, -0.0022, -0.0033, -0.0038, -0.007, -0.0055],
        436: [-0.0085, -0.0135, -0.0029, 0.0112, 0.0031, 0.0014, 0.0134, 0.006, -0.0198, 0.0002, 0.0023, -0.0112, -0.0101, 0.0098, 0.0161, 0],
        628: [0.0332, -0.0244, -0.0047, 0.0156, 0.0135, -0.0048, 0.1069, 0.0078, -0.0004, -0.001, 0.0259, 0.0019, 0.0045, 0.0001, 0.0167, 0.0045, 0.0073, -0.0015, 0.0003, 0.0037, -0.0104, 0.0016, 0.0111, 0.0388],
        10204: [-0.0142, 0.0201, 0.0236, 0.0223, -0.0432, 0.0282, 0.0025, 0.017, -0.0074, 0, 0.0023, -0.0155, 0.01, -0.0251, 0.0216, -0.0107],
        10673: [0.0015, -0.0016, 0.0127, 0.0085, -0.0071, 0.022, 0.0125, -0.0226, -0.015, -0.0289, 0.0003, 0.0092, 0.019, -0.0134, 0.0092, 0.0156],
        2752: [-0.0344, 0.0007, 0.0005, 0.0107, 0.0082, 0.0012, 0.0121, 0.0209, 0.0053, -0.003, 0.0061, 0.0112, -0.0121, 0.0022, 0.0043, -0.0106],
        6549: [0.027, -0.0023, -0.0223, -0.0077, -0.0177, -0.0028, 0.0177, 0.0247, -0.0165, -0.0132, -0.0197, -0.0101, -0.0199, -0.0309, -0.0062, 0.0103]
      };
      /* real sentence "I can dependably deploy LLMs" (tokenization.examples[0]) in sentence order */
      var CHIPS = [
        { id: 40, t: 'I' }, { id: 628, t: ' can' }, { id: 6549, t: ' depend' }, { id: 2752, t: 'ably' },
        { id: 10204, t: ' deploy' }, { id: 436, t: ' L' }, { id: 10673, t: 'LM' }, { id: 82, t: 's' }
      ];
      /* table rows in id order; 0 = a "..." row of skipped ids */
      var ROWS = [0, 40, 0, 82, 0, 436, 0, 628, 0, 2752, 0, 6549, 0, 10204, 0, 10673];

      function el(tag, attrs, parent, text) {
        var e = document.createElementNS(NS, tag), k;
        for (k in attrs) e.setAttribute(k, attrs[k]);
        if (text != null) e.textContent = text;
        if (parent) parent.appendChild(e);
        return e;
      }
      function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
      function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
      var rnd = rng(248320);
      function stylised() { var g = (rnd() + rnd() + rnd() + rnd() - 2) * 0.021; return rnd() < 0.06 ? g * 3 : g; }
      function heat(v) { return 0.07 + 0.93 * Math.min(1, Math.pow(Math.abs(v) / 0.035, 0.85)); }
      function colFade(c) { var t = clamp01((c - 4) / (NC - 5)); return 1 - 0.88 * t * t * (3 - 2 * t); }
      function rowY(k) { return TOP + k * RP + RP / 2; }
      function label(t) { return t.charAt(0) === ' ' ? '·' + t.slice(1) : t; }

      /* ---- the table ---- */
      var tbl = document.getElementById(ID + '-tbl'), hl = document.getElementById(ID + '-hl');
      var chipsG = document.getElementById(ID + '-chips'), cardG = document.getElementById(ID + '-card');
      var rowOfId = {};
      ROWS.forEach(function (id, k) {
        var g = el('g', { 'class': 'row ' + (id ? 'lit' : 'gap') }, tbl), real = REAL[id] || [], c, v;
        for (c = 0; c < NC; c++) {
          v = c < real.length ? real[c] : stylised();
          el('rect', { 'class': 'cell', x: (GX0 + c * CP + 1.5).toFixed(1), y: TOP + k * RP + 1.5, width: (CP - 3).toFixed(1), height: RP - 3, rx: 2.5, 'fill-opacity': (heat(v) * colFade(c)).toFixed(3) }, g);
        }
        el('text', { 'class': 'gl', x: GX0 - 14, y: rowY(k) + 7 }, g, id ? String(id) : '...');
        if (id) rowOfId[id] = k;
      });
      el('text', { 'class': 'hdr', x: GX0 - 14, y: TOP - 8 }, tbl, 'token id');

      var footG = el('g', { 'class': 'foot' }, tbl), bY = TOP + ROWS.length * RP + 8, mid = GX0 + GW / 2;
      el('path', { 'class': 'brk', d: 'M' + GX0 + ' ' + bY + ' v8 H' + (mid - 95) + ' M' + (mid + 95) + ' ' + (bY + 8) + ' H' + (GX0 + GW) + ' v-8' }, footG);
      el('text', { 'class': 'brk-lab', x: mid, y: bY + 15 }, footG, '5,120 numbers');
      el('text', { 'class': 'cap1', x: mid, y: bY + 56 }, footG, 'embed_tokens.weight  [248,320 x 5,120]');
      var c2 = el('text', { 'class': 'cap2', x: mid, y: bY + 86 }, footG);
      el('tspan', {}, c2, '1,271,398,400 numbers');
      c2.appendChild(document.createTextNode('  =  '));
      el('tspan', {}, c2, '2.54 GB');
      c2.appendChild(document.createTextNode(' in bf16'));

      /* ---- chips, with lines + pins to their rows ---- */
      var widths = CHIPS.map(function (ch) { return Math.max(54, label(ch.t).length * 12.2 + 30); });
      var sum = widths.reduce(function (a, b) { return a + b; }, 0), gap = (GW - sum) / (CHIPS.length - 1), x = GX0, CX = {};
      CHIPS.forEach(function (ch, i) {
        var w = widths[i], cx = x + w / 2, y = rowY(rowOfId[ch.id]), len = y - 74;
        var g = el('g', { 'class': 'chip' + (ch.id === 628 ? ' keep' : '') }, chipsG);
        el('rect', { 'class': 'chip-box', x: x.toFixed(1), y: 4, width: w.toFixed(1), height: 36, rx: 9 }, g);
        el('text', { 'class': 'chip-txt', x: cx.toFixed(1), y: 29 }, g, label(ch.t));
        el('text', { 'class': 'chip-id', x: cx.toFixed(1), y: 64 }, g, String(ch.id));
        CX[ch.id] = cx;
        var keep = ch.id === 628 ? ' keep' : '', d = (i * 0.09).toFixed(2) + 's';
        var ln = el('line', { 'class': 'drop' + keep, x1: cx.toFixed(1), y1: 74, x2: cx.toFixed(1), y2: y.toFixed(1) }, hl);
        ln.style.setProperty('--len', len.toFixed(0)); ln.style.setProperty('--d', d);
        var ol = el('rect', { 'class': 'ol' + keep, x: GX0 - 3, y: y - RP / 2 - 0.5, width: GW + 6, height: RP + 1, rx: 5 }, hl);
        ol.style.setProperty('--d', d);
        var pn = el('circle', { 'class': 'pin' + keep, cx: cx.toFixed(1), cy: y.toFixed(1), r: 5.5 }, hl);
        pn.style.setProperty('--d', d);
        x += w + gap;
      });

      /* ---- the lifted strip (step 3): real first 8 numbers of row 628 ---- */
      var SX = 150, SW = 920, SLOT = 108, Y628 = rowY(rowOfId[628]);
      var card = el('rect', { 'class': 'card-bg', rx: 12 }, cardG);
      var strip = el('rect', { 'class': 'strip', rx: 8 }, cardG);
      var inner = el('g', {}, cardG), i;
      for (i = 1; i <= 8; i++) el('line', { 'class': 'sep', x1: SX + i * SLOT, x2: SX + i * SLOT, y1: 0, y2: 0 }, inner);
      var seps = [].slice.call(inner.querySelectorAll('.sep'));
      var nums = REAL[628].slice(0, 8).map(function (v, k) { return el('text', { 'class': 'sn', x: SX + k * SLOT + SLOT / 2 }, inner, String(v)); });
      var dots = el('text', { 'class': 'sdots', x: SX + 8 * SLOT + (SW - 8 * SLOT) / 2 }, inner, '...');
      var lab = el('text', { 'class': 'clab', x: SX, y: 204 }, inner);
      lab.appendChild(document.createTextNode('row 628'));
      el('tspan', {}, lab, '  =  ');
      el('tspan', { 'class': 'w' }, lab, '" can"');
      var sb = el('g', {}, inner);
      el('path', { 'class': 'brk', d: 'M' + SX + ' 310 v8 H' + (SX + SW / 2 - 95) + ' M' + (SX + SW / 2 + 95) + ' 318 H' + (SX + SW) + ' v-8' }, sb);
      el('text', { 'class': 'brk-lab', x: SX + SW / 2, y: 325 }, sb, '5,120 numbers');

      function lerp(a, b, t) { return a + (b - a) * t; }
      var S = 0, cancel = null;
      function drawCard(s) {
        cardG.style.opacity = clamp01(s * 4);
        card.setAttribute('x', lerp(SX, 118, s)); card.setAttribute('width', lerp(SW, 984, s));
        card.setAttribute('y', lerp(Y628 - 14, 168, s)); card.setAttribute('height', lerp(28, 188, s));
        var sy = lerp(Y628 - 12, 222, s), sh = lerp(24, 76, s);
        strip.setAttribute('x', SX); strip.setAttribute('width', SW); strip.setAttribute('y', sy); strip.setAttribute('height', sh);
        seps.forEach(function (l) { l.setAttribute('y1', sy); l.setAttribute('y2', sy + sh); });
        nums.forEach(function (t) { t.setAttribute('y', sy + sh / 2 + 7); });
        dots.setAttribute('y', sy + sh / 2 + 7);
        inner.style.opacity = clamp01((s - 0.45) / 0.55);
      }

      var root = document.getElementById(ID);
      Deck.slide('s19-embedding-table', {
        enter: function () { S = 0; drawCard(0); },
        step: function (n, prev, c) {
          root.classList.toggle('ge1', n >= 1);
          root.classList.toggle('ge2', n >= 2);
          root.classList.toggle('ge3', n >= 3);
          var target = n >= 3 ? 1 : 0, from = S;
          if (cancel) cancel();
          if (c.instant) { S = target; drawCard(S); return; }
          cancel = Deck.tween(900, function (t) { S = Deck.lerp(from, target, t); drawCard(S); });
        }
      });
    })();
  </script>
</section>
