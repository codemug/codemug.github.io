<section class="slide" id="s04-vec-many" data-steps="1" data-tool="vector">
  <p class="kicker reveal">refresher 1</p>
  <p class="statement reveal">Real models use thousands of numbers per vector.</p>
  <div class="stage reveal">
    <svg class="diagram" viewBox="0 0 1000 420" role="img" aria-labelledby="s04-vec-many-t s04-vec-many-d">
      <title id="s04-vec-many-t">Real models use thousands of numbers per vector</title>
      <desc id="s04-vec-many-d">Three stacked arrays of two, three and 5,120 numbers. The third array expands into a big barcode of the real first 64 values of the token " can" in Qwen3.8-27B: bars up for positive values and down for negative values around a baseline, the first two arrays fading back.</desc>

      <g id="s04-vec-many-l12">
        <text class="arr" x="80" y="118">[3, 2]</text>
        <text class="arr" x="80" y="218">[3, 2, 1]</text>
        <text class="cnt" x="920" y="118">2 numbers</text>
        <text class="cnt" x="920" y="218">3 numbers</text>
      </g>
      <g id="s04-vec-many-l3">
        <text class="arr arr3" x="80" y="318">[3, 2, 1, 4, -1, ...]</text>
        <text class="cnt cnt3" x="920" y="318">5,120 numbers</text>
      </g>

      <g id="s04-vec-many-bc">
        <line class="base" id="s04-vec-many-base" x1="130" y1="340" x2="870" y2="340" opacity="0"/>
        <g id="s04-vec-many-bars"></g>
        <text id="s04-vec-many-cap" class="cap" x="500" y="405" opacity="0">token " can" · first 64 of 5,120 numbers</text>
      </g>
    </svg>
  </div>

  <style>
    #s04-vec-many svg.diagram{width:auto;height:100%;max-width:100%;}
    #s04-vec-many text{font-family:var(--font-mono);}
    #s04-vec-many .arr{font-size:42px;fill:var(--color-text-muted);}
    #s04-vec-many .arr3{fill:var(--color-text);}
    #s04-vec-many .cnt{font-size:20px;fill:var(--color-text-faint);text-anchor:end;}
    #s04-vec-many .cnt3{fill:var(--color-text-muted);}
    #s04-vec-many .base{stroke:var(--color-text-faint);stroke-width:1.5;}
    #s04-vec-many .bar{fill:var(--color-accent);}
    #s04-vec-many .cap{font-size:20px;fill:var(--color-text-muted);text-anchor:middle;}
  </style>
  <script>
    (function () {
      var ID = 's04-vec-many', NS = 'http://www.w3.org/2000/svg';
      /* REAL values, copied exactly from deck/data/qwen38.json -> embedding_full["628"] (first 64)
         (the real embedding row of the token " can" in Qwen/Qwen3.8-27B) */
      var V628 = [0.0332, -0.0244, -0.0047, 0.0156, 0.0135, -0.0048, 0.1069, 0.0078,
        -0.0004, -0.001, 0.0259, 0.0019, 0.0045, 0.0001, 0.0167, 0.0045,
        0.0073, -0.0015, 0.0003, 0.0037, -0.0104, 0.0016, 0.0111, 0.0388,
        -0.013, 0.004, -0.0184, -0.0031, -0.0049, 0.0053, 0.0001, -0.0058,
        -0.0053, -0.0023, -0.0034, 0.0016, -0.0008, 0.0056, -0.0013, -0.0029,
        0.0024, 0.001, 0.0525, -0.001, 0.0139, -0.0039, 0.0012, -0.0068,
        -0.007, 0.0012, 0.0025, -0.0013, 0.0054, -0.0013, 0.0033, -0.0195,
        0.012, 0.0049, 0.0031, -0.006, -0.0037, -0.0026, 0.0022, 0.0028];
      var BASE = 340, K = 128 / 0.1069, MINH = 3; /* 0.1069 (tallest) -> 128 units (~140px @ 1280) */

      var barsG = document.getElementById(ID + '-bars');
      var bars = V628.map(function (v, i) {
        var h = Math.max(Math.abs(v) * K, MINH);
        var r = document.createElementNS(NS, 'rect');
        r.setAttribute('class', 'bar');
        r.setAttribute('x', (140 + i * 11.25 + 1.875).toFixed(2));
        r.setAttribute('width', '7.5');
        r.setAttribute('y', BASE);
        r.setAttribute('height', '0');
        barsG.appendChild(r);
        return { el: r, h: h, neg: v < 0 };
      });

      var l12 = document.getElementById(ID + '-l12');
      var l3 = document.getElementById(ID + '-l3');
      var base = document.getElementById(ID + '-base');
      var cap = document.getElementById(ID + '-cap');

      var S = 0, cancel = null;
      function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

      function draw(s) {
        var B = clamp01((s - 0.45) / 0.55); /* bars grow after the third array has faded */
        var C = clamp01((s - 0.65) / 0.35); /* caption last */
        l12.setAttribute('transform', 'translate(0,' + (-65 * s).toFixed(2) + ')');
        l12.style.opacity = (1 - 0.7 * s).toFixed(3);
        l3.style.opacity = clamp01(1 - s / 0.55).toFixed(3);
        base.style.opacity = B.toFixed(3);
        bars.forEach(function (b) {
          var h = b.h * B;
          b.el.setAttribute('height', h.toFixed(2));
          b.el.setAttribute('y', b.neg ? BASE : (BASE - h).toFixed(2));
        });
        cap.style.opacity = C.toFixed(3);
      }

      Deck.slide('s04-vec-many', {
        enter: function () { S = 0; draw(0); },
        step: function (n, prev, c) {
          var target = n >= 1 ? 1 : 0, from = S;
          if (cancel) cancel();
          if (c.instant) { S = target; draw(S); return; }
          cancel = Deck.tween(900, function (t) {
            S = Deck.lerp(from, target, t);
            draw(S);
          });
        }
      });
    })();
  </script>
</section>
