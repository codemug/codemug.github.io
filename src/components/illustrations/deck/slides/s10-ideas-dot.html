<section class="slide" id="s10-ideas-dot" data-steps="3" data-tool="dot">
  <p class="kicker reveal">refresher 3</p>
  <p class="statement reveal">Sand and rock point the same way, so their dot product is positive.</p>
  <div class="stage reveal">
    <svg class="diagram" viewBox="0 0 1120 520" role="img" aria-labelledby="s10-ideas-dot-t s10-ideas-dot-d">
      <title id="s10-ideas-dot-t">Dot product of ideas</title>
      <desc id="s10-ideas-dot-d">The same plane of ideas: forest to desert across, non-living to living up. Sand and rock are cyan arrows that point the same way, both into the non-living half, so their dot product, worked out beside the plane as 0.80 times 0.15 plus minus 0.60 times minus 0.95, is plus 0.69 on a gauge from minus one to plus one. Then rock turns grey and fern, which points the opposite way, is compared with sand: the dot product is minus 0.92.</desc>
    </svg>
  </div>

  <style>
    #s10-ideas-dot .statement{max-width:1120px;}
    #s10-ideas-dot svg.diagram{width:100%;height:100%;max-width:none;}
    #s10-ideas-dot text{font-family:var(--font-mono);}
    #s10-ideas-dot .half{fill:var(--color-accent);fill-opacity:.07;}
    #s10-ideas-dot .grd{stroke:var(--color-hairline);stroke-width:1;}
    #s10-ideas-dot .axl{stroke:var(--color-text-faint);stroke-width:2;}
    #s10-ideas-dot .axh{fill:var(--color-text-faint);}
    #s10-ideas-dot .ax{font-size:24px;fill:var(--color-text-soft);}
    #s10-ideas-dot .halo{paint-order:stroke;stroke:var(--color-bg);stroke-width:7px;stroke-linejoin:round;}
    #s10-ideas-dot .vg{transition:color .6s,opacity .5s ease;}
    #s10-ideas-dot .tg{transition:color .6s,opacity .5s ease .4s;}
    #s10-ideas-dot .late{transition:opacity .5s ease .4s;}
    #s10-ideas-dot .cy{color:var(--color-accent);}
    #s10-ideas-dot .gr{color:var(--color-text-dim);}
    #s10-ideas-dot .tg.gr{color:var(--color-text-muted);}
    #s10-ideas-dot .sh{stroke:currentColor;stroke-width:4.5;stroke-linecap:round;fill:none;}
    #s10-ideas-dot .hd{fill:currentColor;stroke:none;}
    #s10-ideas-dot .nm{font-size:24px;font-weight:600;fill:currentColor;}
    #s10-ideas-dot .av{font-size:20px;fill:currentColor;}
    #s10-ideas-dot .arc{fill:none;stroke:var(--color-accent);stroke-width:3;stroke-linecap:round;stroke-opacity:.9;}
    #s10-ideas-dot .hdr{font-size:30px;fill:var(--color-text-soft);}
    #s10-ideas-dot .mx{font-size:22px;fill:var(--color-text-soft);}
    #s10-ideas-dot .big{font-size:54px;fill:var(--color-accent);}
    #s10-ideas-dot .big.q{fill:var(--color-text-dim);}
    #s10-ideas-dot .why{font-size:20px;fill:var(--color-text-muted);}
    #s10-ideas-dot .gtrack{stroke:var(--color-border-strong);stroke-width:3;stroke-linecap:round;}
    #s10-ideas-dot .gtick{stroke:var(--color-text-faint);stroke-width:2;}
    #s10-ideas-dot .glab{font-size:20px;fill:var(--color-text-muted);}
    #s10-ideas-dot .gcap{font-size:20px;fill:var(--color-text-dim);}
    #s10-ideas-dot .mk{fill:currentColor;}
    #s10-ideas-dot .mkl{font-size:22px;font-weight:600;fill:currentColor;}
  </style>

  <script>
    (function () {
      var root = document.getElementById('s10-ideas-dot');
      var svg = root.querySelector('svg.diagram');
      var NS = svg.namespaceURI;
      // one plane for s09, s10 and s11: same origin, same scale, same positions
      var OX = 330, OY = 262, U = 190, EXT = 1.1, R = EXT * U;
      var P = Deck.plane({ ox: OX, oy: OY, u: U });
      var SAND = [0.80, -0.60], ROCK = [0.15, -0.95], FERN = [-0.70, 0.60];

      function el(tag, attrs, parent, text) {
        var e = document.createElementNS(NS, tag);
        Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
        if (text !== undefined) e.textContent = text;
        if (parent) parent.appendChild(e);
        return e;
      }
      function f2(x) { var s = Math.abs(x).toFixed(2); return (x < 0 && s !== '0.00' ? '−' : '') + s; }
      function arr(v) { return '[' + f2(v[0]) + ', ' + f2(v[1]) + ']'; }
      function fp(x) { return x < 0 ? '(' + f2(x) + ')' : f2(x); }

      // the non-living half of the plane, shaded while the two non-living arrows are compared
      el('rect', { 'class': 'half vg', x: OX - R, y: OY, width: 2 * R, height: R, 'data-from': 1, 'data-until': 3 }, svg);

      function buildPlane() {
        var g = el('g', {}, svg);
        [-1, -0.5, 0.5, 1].forEach(function (k) {
          el('line', { 'class': 'grd', x1: P.X(k), y1: P.Y(-EXT), x2: P.X(k), y2: P.Y(EXT) }, g);
          el('line', { 'class': 'grd', x1: P.X(-EXT), y1: P.Y(k), x2: P.X(EXT), y2: P.Y(k) }, g);
        });
        el('line', { 'class': 'axl', x1: OX - R + 10, y1: OY, x2: OX + R - 10, y2: OY }, g);
        el('line', { 'class': 'axl', x1: OX, y1: OY - R + 10, x2: OX, y2: OY + R - 10 }, g);
        [[OX + R, OY, -1, 0], [OX - R, OY, 1, 0], [OX, OY - R, 0, 1], [OX, OY + R, 0, -1]].forEach(function (h) {
          var bx = h[0] + h[2] * 14, by = h[1] + h[3] * 14, nx = -h[3] * 6, ny = h[2] * 6;
          el('polygon', { 'class': 'axh', points: [h[0], h[1], bx + nx, by + ny, bx - nx, by - ny].join(' ') }, g);
        });
        el('text', { 'class': 'ax', x: OX - R - 14, y: OY + 8, 'text-anchor': 'end' }, g, 'forest');
        el('text', { 'class': 'ax', x: OX + R + 14, y: OY + 8 }, g, 'desert');
        el('text', { 'class': 'ax', x: OX, y: OY - R - 18, 'text-anchor': 'middle' }, g, 'living');
        el('text', { 'class': 'ax', x: OX, y: OY + R + 34, 'text-anchor': 'middle' }, g, 'non-living');
      }

      // a static arrow from the origin to v (math coordinates)
      function arrow(parent, cls, v) {
        var g = el('g', { 'class': 'vg ' + cls }, parent);
        var t = P.P(v[0], v[1]), dx = t[0] - OX, dy = t[1] - OY, len = Math.hypot(dx, dy);
        var ux = dx / len, uy = dy / len, L = 22, bx = t[0] - ux * L, by = t[1] - uy * L;
        el('line', { 'class': 'sh', x1: OX, y1: OY, x2: t[0] - ux * (L - 3), y2: t[1] - uy * (L - 3) }, g);
        el('polygon', { 'class': 'hd', points: [t[0], t[1], bx - uy * 10, by + ux * 10, bx + uy * 10, by - ux * 10].join(' ') }, g);
        return g;
      }

      // name + array next to a tip (x, y = position of the name baseline)
      function tag(parent, cls, x, y, anchor, name, v) {
        var g = el('g', { 'class': 'vg tg ' + cls }, parent);
        el('text', { 'class': 'nm halo', x: x, y: y, 'text-anchor': anchor }, g, name);
        el('text', { 'class': 'av halo', x: x, y: y + 24, 'text-anchor': anchor }, g, arr(v));
        return g;
      }

      // faint arc for the angle between sand and w
      function arc(parent, w, from, until) {
        var r = 74, a1 = Math.atan2(SAND[1], SAND[0]), a2 = Math.atan2(w[1], w[0]);
        var d = Math.atan2(Math.sin(a2 - a1), Math.cos(a2 - a1));
        var attrs = { 'class': 'arc vg', 'data-from': from,
          d: 'M' + (OX + r * Math.cos(a1)) + ' ' + (OY - r * Math.sin(a1)) + ' A' + r + ' ' + r + ' 0 0 ' + (d > 0 ? 0 : 1) + ' ' +
             (OX + r * Math.cos(a2)) + ' ' + (OY - r * Math.sin(a2)) };
        if (until) attrs['data-until'] = until;
        el('path', attrs, parent);
      }

      buildPlane();
      var gv = el('g', {}, svg);
      arc(gv, ROCK, 1, 3);
      arc(gv, FERN, 3);
      var fernA = arrow(gv, 'gr', FERN), rockA = arrow(gv, 'cy', ROCK), sandA = arrow(gv, 'cy', SAND);
      var tip = function (v) { return P.P(v[0], v[1]); };
      var sandT = tag(gv, 'cy', tip(SAND)[0] + 18, tip(SAND)[1] - 4, 'start', 'sand', SAND);
      var rockT = tag(gv, 'cy', OX - 14, tip(ROCK)[1] - 4, 'end', 'rock', ROCK);
      var fernT = tag(gv, 'gr', tip(FERN)[0] - 18, tip(FERN)[1] - 4, 'end', 'fern', FERN);

      // right panel: the arithmetic, the result and a gauge from -1 to +1 (all numbers come from Deck.dot)
      var PX = 716, GC = 908, HW = 170, GY = 376;
      var panel = el('g', {}, svg);
      // text that is shown from step `from` (until step `until`, if given); `late` waits for the old text to fade out
      function txt(cls, y, text, from, until, late) {
        var a = { 'class': cls + (late ? ' late' : ''), x: PX, y: y, 'data-from': from };
        if (until) a['data-until'] = until;
        return el('text', a, panel, text);
      }
      // the whole working for sand . w; `at` = first step of [header, products, sum, result and reason]
      function working(w, name, at, until, late, why) {
        var p = [SAND[0] * w[0], SAND[1] * w[1]];
        txt('hdr', 80, 'sand \u00b7 ' + name, at[0], until, late);
        txt('mx', 140, fp(SAND[0]) + '\u00d7' + fp(w[0]) + ' + ' + fp(SAND[1]) + '\u00d7' + fp(w[1]), at[1], until, late);
        txt('mx', 180, '= ' + fp(p[0]) + ' + ' + fp(p[1]), at[2], until, late);
        txt('big', 252, '= ' + f2(Deck.dot(SAND, w)), at[3], until, true);
        txt('why', 294, why, at[3], until, true);
      }
      working(ROCK, 'rock', [0, 1, 2, 2], 3, false, 'both non-living: positive');
      working(FERN, 'fern', [3, 3, 3, 3], 0, true, 'opposite ideas: negative');
      txt('big q', 252, '= ?', 0, 2, false);

      el('line', { 'class': 'gtrack', x1: GC - HW, y1: GY, x2: GC + HW, y2: GY }, panel);
      [-1, 0, 1].forEach(function (k) {
        el('line', { 'class': 'gtick', x1: GC + k * HW, y1: GY - 10, x2: GC + k * HW, y2: GY + 10 }, panel);
        el('text', { 'class': 'glab', x: GC + k * HW, y: GY + 38, 'text-anchor': 'middle' }, panel, k > 0 ? '+1' : k < 0 ? '−1' : '0');
      });
      el('text', { 'class': 'gcap', x: GC - HW - 14, y: GY + 68 }, panel, 'opposite');
      el('text', { 'class': 'gcap', x: GC + HW + 14, y: GY + 68, 'text-anchor': 'end' }, panel, 'same way');

      function marker(cls, from, label) {
        var g = el('g', { 'class': 'vg ' + cls, 'data-from': from }, panel);
        el('rect', { 'class': 'mk', x: -3, y: GY - 17, width: 6, height: 34, rx: 3 }, g);
        return { g: g, lab: el('text', { 'class': 'mkl', x: 0, y: GY - 28, 'text-anchor': 'middle' }, g, label) };
      }
      var ghost = marker('gr', 3, 'rock');
      ghost.g.setAttribute('transform', 'translate(' + (GC + Deck.dot(SAND, ROCK) * HW) + ' 0)');
      var live = marker('cy', 2, 'rock');

      var DR = Deck.dot(SAND, ROCK), DF = Deck.dot(SAND, FERN), mv = DR, cancel = null;
      function draw() { live.g.setAttribute('transform', 'translate(' + (GC + mv * HW) + ' 0)'); }
      draw();

      Deck.slide('s10-ideas-dot', {
        enter: function () { mv = DR; draw(); },
        step: function (n, prev, c) {
          var cmp = n >= 3;
          rockA.classList.toggle('cy', !cmp); rockA.classList.toggle('gr', cmp);
          rockT.classList.toggle('cy', !cmp); rockT.classList.toggle('gr', cmp);
          fernA.classList.toggle('cy', cmp); fernA.classList.toggle('gr', !cmp);
          fernT.classList.toggle('cy', cmp); fernT.classList.toggle('gr', !cmp);
          live.lab.textContent = cmp ? 'fern' : 'rock';
          var target = cmp ? DF : DR;
          if (cancel) { cancel(); cancel = null; }
          if (c.instant) { mv = target; draw(); return; }
          var from = mv;
          cancel = Deck.tween(800, function (t) { mv = Deck.lerp(from, target, t); draw(); });
        }
      });
    })();
  </script>
</section>
