<section class="slide" id="s22-random-start" data-steps="1">
  <p class="kicker reveal">training</p>
  <p class="statement reveal">At the start, every number is random.</p>
  <div class="stage reveal">
    <svg class="diagram" viewBox="0 0 1040 500" role="img" aria-labelledby="s22-random-start-t s22-random-start-d">
      <title id="s22-random-start-t">The embedding table before training</title>
      <desc id="s22-random-start-d">A window into the embedding table, 248,320 rows by 5,120 columns, filled with random numbers. Then four tokens, cat, dog, car and king, appear as arrows in a plane, pointing in random directions.</desc>
      <defs>
        <marker id="s22-random-start-ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto"><path d="M0,1 L14,8 L0,15 Z" fill="var(--color-accent)"/></marker>
      </defs>

      <!-- the table window: built by the script, slides left at step 1 -->
      <g id="s22-random-start-tab"></g>

      <!-- the plane (step 1) -->
      <g id="s22-random-start-pl" opacity="0">
        <rect class="frame" x="650" y="44" width="380" height="380" rx="10"/>
        <line class="axis" x1="660" y1="234" x2="1020" y2="234"/>
        <line class="axis" x1="840" y1="54" x2="840" y2="414"/>
        <g id="s22-random-start-arrows"></g>
      </g>

      <text class="cap" x="520" y="476" text-anchor="middle" data-from="0" data-until="1">random numbers</text>
      <text class="cap" x="520" y="476" text-anchor="middle" data-from="1">random numbers, random directions</text>
    </svg>
  </div>

  <style>
    #s22-random-start svg.diagram{max-width:min(1203.2px,1100px);}
    #s22-random-start .frame{fill:none;stroke:var(--color-border);stroke-width:1.5;}
    #s22-random-start .axis{stroke:var(--color-hairline);stroke-width:1.5;}
    #s22-random-start .cap{font-size:21px;fill:var(--color-text-dim);}
    #s22-random-start .tcap{font-size:21px;fill:var(--color-text-muted);}
    #s22-random-start .rl{font-size:22px;fill:var(--color-text-muted);text-anchor:end;}
    #s22-random-start .n{font-size:20px;fill:var(--color-text-soft);text-anchor:end;}
    #s22-random-start .n.a{fill:var(--color-accent);}
    #s22-random-start .hl{fill:color-mix(in oklab,var(--color-accent) 12%,transparent);stroke:color-mix(in oklab,var(--color-accent) 55%,transparent);stroke-width:1.5;}
    #s22-random-start .dots{font-size:34px;fill:var(--color-text-dim);}
    #s22-random-start .arr{stroke:var(--color-accent);stroke-width:3.5;stroke-linecap:round;fill:none;}
    #s22-random-start .tok{font-size:22px;fill:var(--color-accent);}
  </style>
  <script>
    (function () {
      var ID = 's22-random-start', NS = null;
      function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
      function r2(v) { return Math.round(v * 100) / 100; }
      function fmt(v) { var s = Math.abs(v).toFixed(2); return v < 0 ? '−' + s : s; }

      // four random 2D positions (same generator as the s26 slide): well spread, none too short
      var pr = mulberry32(5), pos = [], tries = 0;
      while (pos.length < 4 && tries++ < 500) {
        var x = (pr() * 2 - 1) * 0.75, y = (pr() * 2 - 1) * 0.75;
        if (Math.hypot(x, y) < 0.4) continue;
        if (pos.every(function (p) { return Math.hypot(p[0] - x, p[1] - y) > 0.6; })) pos.push([r2(x), r2(y)]);
      }
      var ROWS = ['cat', 'dog', 'car', 'king', 'lion', 'bus', 'queen', 'pizza'];
      var COLS = 6, PITCH = 84, X0 = 144, Y0 = 76, RH = 44;

      var svg = document.getElementById(ID + '-tab').ownerSVGElement;
      NS = svg.namespaceURI;
      function mk(tag, attrs, parent, text) {
        var e = document.createElementNS(NS, tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        if (text !== undefined) e.textContent = text;
        parent.appendChild(e); return e;
      }

      // table
      var tab = document.getElementById(ID + '-tab');
      mk('text', { 'class': 'tcap', x: 74, y: 30 }, tab, 'embed_tokens.weight  [248,320 x 5,120]');
      mk('rect', { 'class': 'frame', x: 74, y: Y0 - 28, width: PITCH * COLS - 4, height: RH * ROWS.length + 12, rx: 8 }, tab);
      var vr = mulberry32(5120), hl = [];
      ROWS.forEach(function (name, i) {
        var yc = Y0 + i * RH + 4;
        mk('text', { 'class': 'rl', x: 64, y: yc }, tab, name);
        for (var j = 0; j < COLS; j++) {
          var v = (i < 4 && j < 2) ? pos[i][j] : r2((vr() * 2 - 1) * 0.95);
          if (i < 4 && j < 2) {
            var g = mk('g', { 'data-from': 1 }, tab);
            mk('rect', { 'class': 'hl', x: X0 + j * PITCH - 70, y: yc - 24, width: 78, height: 34, rx: 6 }, g);
            mk('text', { 'class': 'n a', x: X0 + j * PITCH, y: yc }, g, fmt(v));
            var pl = mk('text', { 'class': 'n', x: X0 + j * PITCH, y: yc, 'data-from': 0, 'data-until': 1 }, tab, fmt(v));
          } else {
            mk('text', { 'class': 'n', x: X0 + j * PITCH, y: yc }, tab, fmt(v));
          }
        }
      });
      mk('text', { 'class': 'dots', x: X0 + (COLS - 1) * PITCH + 20, y: Y0 + 4 * RH + 6 }, tab, '…');

      // arrows
      var PU = 170, CX = 840, CY = 234, arrows = [];
      var ag = document.getElementById(ID + '-arrows');
      pos.forEach(function (p, i) {
        var tipX = CX + p[0] * PU, tipY = CY - p[1] * PU;
        var ln = mk('line', { 'class': 'arr', x1: CX, y1: CY, x2: CX, y2: CY, 'marker-end': 'url(#' + ID + '-ah)' }, ag);
        var right = p[0] >= 0;
        var lab = mk('text', { 'class': 'tok', x: tipX + (right ? 14 : -14), y: tipY + (p[1] >= 0 ? -10 : 24), 'text-anchor': right ? 'start' : 'end' }, ag, ROWS[i]);
        arrows.push({ ln: ln, lab: lab, tx: tipX, ty: tipY });
      });

      var P = 0;
      function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
      function draw() {
        tab.setAttribute('transform', 'translate(' + Deck.lerp(215, 14, clamp(P / 0.7)).toFixed(1) + ' 0)');
        document.getElementById(ID + '-pl').setAttribute('opacity', clamp((P - 0.25) / 0.3));
        arrows.forEach(function (a, i) {
          var g = Deck.ease.out(clamp((P - 0.45 - i * 0.1) / 0.4));
          a.ln.setAttribute('x2', CX + (a.tx - CX) * g);
          a.ln.setAttribute('y2', CY + (a.ty - CY) * g);
          a.ln.style.opacity = g > 0.02 ? 1 : 0;
          a.lab.style.opacity = clamp((g - 0.7) / 0.3);
        });
      }

      Deck.slide('s22-random-start', {
        enter: function () { P = 0; draw(); },
        step: function (n, prev, c) {
          var target = n >= 1 ? 1 : 0;
          if (c.instant) { P = target; draw(); return; }
          var from = P;
          Deck.tween(1100, function (t) { P = Deck.lerp(from, target, t); draw(); });
        }
      });
    })();
  </script>
</section>
