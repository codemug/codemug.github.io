<section class="slide" id="s41-wu-wd-intro" data-steps="3" data-tool="matrix">
  <p class="kicker reveal">feed-forward</p>
  <p class="statement reveal">Feed-forward has two matrices: Wu widens the vector, Wd narrows it back.</p>
  <div class="stage reveal">
    <svg class="diagram" viewBox="0 0 1120 520" role="img" aria-labelledby="s41-wu-wd-intro-t s41-wu-wd-intro-d">
      <title id="s41-wu-wd-intro-t">Wu widens the vector, Wd narrows it back</title>
      <desc id="s41-wu-wd-intro-d">A left-to-right chain. A token vector of 5,120 numbers goes through Wu, a wide matrix, and comes out much longer, 17,408 numbers. That long vector goes through Wd, a tall matrix, and comes out as 5,120 numbers again. In the first step Wu and the widening light up, in the second Wd and the narrowing, and in the last step each matrix is shown to hold 89,128,960 numbers.</desc>
      <g id="s41-wu-wd-intro-flow"></g>
      <g data-from="0" data-until="1"><text class="cap" x="560" y="462">two matrices: Wu and Wd</text></g>
      <g data-from="1" data-until="2"><text class="cap" x="560" y="462">Wu widens the vector: 5,120 → 17,408 numbers</text></g>
      <g data-from="2" data-until="3"><text class="cap" x="560" y="462">Wd narrows it back: 17,408 → 5,120 numbers</text></g>
      <g data-from="3"><text class="cap" x="560" y="462">each matrix holds 5,120 × 17,408 = 89,128,960 numbers</text></g>
    </svg>
  </div>

  <style>
    #s41-wu-wd-intro svg.diagram{width:100%;height:100%;max-width:none;}
    #s41-wu-wd-intro text{font-family:var(--font-mono);}
    #s41-wu-wd-intro .nd{color:#5a5a63;transition:color .6s;}
    #s41-wu-wd-intro .nd.done{color:var(--color-text-muted);}
    #s41-wu-wd-intro .nd.act{color:var(--color-accent);}
    #s41-wu-wd-intro .ob{fill:var(--color-surface-deep);stroke:currentColor;stroke-width:3;}
    #s41-wu-wd-intro .nd.act .ob{fill:color-mix(in oklab,var(--color-accent) 8%,var(--color-surface-deep));}
    #s41-wu-wd-intro .ot{font-size:34px;font-weight:600;fill:currentColor;text-anchor:middle;}
    #s41-wu-wd-intro .tn{font-size:22px;fill:currentColor;text-anchor:middle;}
    #s41-wu-wd-intro .cnt{font-size:22px;fill:currentColor;text-anchor:middle;}
    #s41-wu-wd-intro .cell{fill:currentColor;}
    #s41-wu-wd-intro .ph{fill:none;stroke:var(--color-border-strong);stroke-width:2;stroke-dasharray:6 6;}
    #s41-wu-wd-intro .ay{fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;}
    #s41-wu-wd-intro .cap{font-size:26px;fill:var(--color-accent);text-anchor:middle;}
  </style>

  <script>
    (function () {
      var ID = 's41-wu-wd-intro';
      var NS = 'http://www.w3.org/2000/svg';
      function el(tag, attrs, parent, text) {
        var e = document.createElementNS(NS, tag);
        Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
        if (text !== undefined) e.textContent = text;
        if (parent) parent.appendChild(e);
        return e;
      }
      function seeded(i) { var s = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return s - Math.floor(s); }
      function clamp(v) { return Math.max(0, Math.min(1, v)); }

      // REAL shapes (deck/data/qwen38.json, layer 3 and config): hidden_size 5120, intermediate_size 17408 = 3.4 x 5120,
      // so the long strip has 3.4 x the cells of the short one (16 -> 54).
      var HID = '5,120', MID = '17,408';
      var PITCH = 7, CW = 6, SH = 124, CY = 240, G = 34;
      var N_SHORT = 16, N_LONG = 54;

      var gf = document.getElementById(ID + '-flow');
      var parts = [];                                // { g, steps: the steps in which it is lit }
      function part(steps) { var g = el('g', { 'class': 'nd' }, gf); parts.push({ g: g, steps: steps }); return g; }
      function arrow(x1, x2) { var g = part([]); el('path', { 'class': 'ay', d: 'M' + x1 + ' ' + CY + 'H' + (x2 - 2) + 'm-10 -9l10 9l-10 9' }, g); }

      function strip(steps, x0, n, count, ghost) {
        var g = part(steps), cells = [];
        if (ghost) el('rect', { 'class': 'ph', x: x0 - 6, y: CY - SH / 2 - 6, width: n * PITCH + 11, height: SH + 12, rx: 10 }, g);
        for (var i = 0; i !== n; i++) {
          var h = SH * (0.2 + 0.8 * seeded(i + n * 7));
          cells.push(el('rect', { 'class': 'cell', x: x0 + i * PITCH, y: CY - h / 2, width: CW, height: h, rx: 1 }, g));
        }
        var label = el('text', { 'class': 'cnt', x: x0 + n * PITCH / 2, y: CY + SH / 2 + 38 }, g, count);
        return { cells: cells, label: label };
      }
      function matrix(steps, x0, w, h, name, tensor, shape) {
        var g = part(steps);
        el('rect', { 'class': 'ob', x: x0, y: CY - h / 2, width: w, height: h, rx: 14 }, g);
        el('text', { 'class': 'ot', x: x0 + w / 2, y: CY + 12 }, g, name);
        el('text', { 'class': 'tn', x: x0 + w / 2, y: CY - h / 2 - 16 }, g, tensor);
        el('text', { 'class': 'tn', x: x0 + w / 2, y: CY + h / 2 + 34 }, g, shape);
      }

      var x = 36;
      strip([1], x, N_SHORT, HID, false);              x += N_SHORT * PITCH + G;
      arrow(x - G, x);
      matrix([1, 3], x, 240, 70, 'Wu', 'up_proj', HID + ' → ' + MID);   x += 240 + G;
      arrow(x - G, x);
      var wide = strip([1, 2], x, N_LONG, MID, true);   x += N_LONG * PITCH + G;
      arrow(x - G, x);
      matrix([2, 3], x, 70, 240, 'Wd', 'down_proj', MID + ' → ' + HID); x += 70 + G;
      arrow(x - G, x);
      var out = strip([2], x, N_SHORT, HID, true);

      // the two new strips fill in from the left as the matrix that produces them lights up
      var P = [0, 0], cancel = null;
      function fill(s, p) {
        var n = s.cells.length;
        s.cells.forEach(function (c, i) { c.style.opacity = clamp(p * (n + 6) - i).toFixed(3); });
        s.label.style.opacity = clamp(p * 1.6 - 0.6).toFixed(3);
      }
      function draw() { fill(wide, P[0]); fill(out, P[1]); }
      function paint(n) {
        parts.forEach(function (o) { o.g.setAttribute('class', 'nd ' + (o.steps.indexOf(n) !== -1 ? 'act' : n > 0 && o.steps.length && Math.min.apply(null, o.steps) < n ? 'done' : '')); });
      }
      draw();

      Deck.slide('s41-wu-wd-intro', {
        enter: function () { P = [0, 0]; draw(); paint(0); },
        step: function (n, prev, c) {
          paint(n);
          var target = [n >= 1 ? 1 : 0, n >= 2 ? 1 : 0];
          if (cancel) { cancel(); cancel = null; }
          if (c.instant) { P = target; draw(); return; }
          var from = P.slice();
          cancel = Deck.tween(900, function (t) { P = [Deck.lerp(from[0], target[0], t), Deck.lerp(from[1], target[1], t)]; draw(); });
        }
      });
    })();
  </script>
</section>
