<section class="slide" id="d204-streamer-pipeline" data-steps="3">
  <p class="kicker reveal">model loading</p>
  <p class="statement reveal">The streamer reads while the GPU loads.</p>
  <div class="stage reveal">
    <svg class="diagram" viewBox="0 0 1120 520" role="img" aria-labelledby="d204-streamer-pipeline-t d204-streamer-pipeline-d">
      <title id="d204-streamer-pipeline-t">Run:ai Model Streamer pipeline from S3 to the GPU, compared with a loader that copies everything first</title>
      <desc id="d204-streamer-pipeline-d">Top lane, the default loader: the files are first copied in full to local disk, then loaded into the GPU, two phases one after the other, so the GPU is idle during the copy. Bottom lane, the Run:ai Model Streamer: 3 safetensors shards totalling 20.42 GiB are read from S3 by 16 concurrent clients (concurrency 16, default 8 clients, 8 MiB chunks, NIC ceiling 50 Gbps) into a CPU buffer (memory_limit, default 40 GB, 18 ring buffers, pod RAM needs the buffer plus about 10 GiB) and copied to the GPU tensor by tensor while later chunks are still being read. Timing in the animation is illustrative, not a benchmark.</desc>
      <defs>
        <marker id="d204-streamer-pipeline-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 Z"/></marker>
      </defs>
      <g id="d204-streamer-pipeline-g"></g>
    </svg>
  </div>

  <style>
    #d204-streamer-pipeline svg.diagram{width:100%;height:100%;max-width:none;}
    #d204-streamer-pipeline text{font-family:var(--font-mono);}
    #d204-streamer-pipeline .ah{fill:var(--color-text-dim);}
    #d204-streamer-pipeline .tA{font-size:26px;font-weight:700;fill:var(--color-text-muted);}
    #d204-streamer-pipeline .tB{font-size:26px;font-weight:700;fill:var(--color-accent);}
    #d204-streamer-pipeline .sub{font-size:22px;fill:var(--color-text-dim);}
    #d204-streamer-pipeline .bxA{fill:var(--color-surface-deep);stroke:var(--color-text-dim);stroke-width:2.5;}
    #d204-streamer-pipeline .bxB{fill:var(--color-surface-deep);stroke:var(--color-accent-muted);stroke-width:2.5;}
    #d204-streamer-pipeline .nm{font-size:24px;fill:var(--color-text);}
    #d204-streamer-pipeline .nmc{font-size:24px;text-anchor:middle;fill:var(--color-text);}
    #d204-streamer-pipeline .pct{font-size:24px;font-weight:700;text-anchor:end;fill:var(--color-accent);}
    #d204-streamer-pipeline .trk{fill:color-mix(in oklab,var(--color-text-muted) 16%,var(--color-surface-deep));}
    #d204-streamer-pipeline .fillD{fill:var(--color-text-muted);}
    #d204-streamer-pipeline .fillG{fill:var(--color-accent);}
    #d204-streamer-pipeline .ln{stroke:var(--color-text-dim);stroke-width:2.5;fill:none;marker-end:url(#d204-streamer-pipeline-ah);}
    #d204-streamer-pipeline .ph{font-size:22px;text-anchor:middle;fill:var(--color-text-dim);}
    #d204-streamer-pipeline .ph.on{fill:var(--color-accent);font-weight:700;}
    #d204-streamer-pipeline .chA{fill:var(--color-text-soft);}
    #d204-streamer-pipeline .chB{fill:var(--color-accent);}
    #d204-streamer-pipeline .shard{fill:color-mix(in oklab,var(--color-text-muted) 40%,var(--color-surface-deep));stroke:var(--color-text-dim);stroke-width:1.5;}
    #d204-streamer-pipeline .rd{fill:var(--color-accent);}
    #d204-streamer-pipeline .rb{fill:var(--color-accent);}
    #d204-streamer-pipeline .rbo{fill:none;stroke:var(--color-accent-muted);stroke-width:1.5;}
    #d204-streamer-pipeline .k1{font-size:24px;font-weight:700;fill:var(--color-accent);}
    #d204-streamer-pipeline .k2{font-size:22px;fill:var(--color-text-muted);}
    #d204-streamer-pipeline .k3{font-size:22px;fill:var(--color-text-dim);}
  </style>

  <script>
    (function () {
      var ID = 'd204-streamer-pipeline';
      var NS = 'http://www.w3.org/2000/svg';
      function el(tag, attrs, parent, text) {
        var e = document.createElementNS(NS, tag);
        Object.keys(attrs || {}).forEach(function (key) { e.setAttribute(key, attrs[key]); });
        if (text !== undefined) e.textContent = text;
        if (parent) parent.appendChild(e);
        return e;
      }
      function clamp(v) { return Math.max(0, Math.min(1, v)); }

      // ---- numbers: L2 NOTES-4.md (sections 1, 3, 4, 5) and NOTES.md (hardware row, diagram idea 5)
      var SHARD_GB = [9.97, 9.99, 1.97];   // NOTES-4 line 46, nvidia/Qwen3.8-27B-NVFP4 shard sizes
      var WEIGHTS_GIB = (21921428072 / Math.pow(2, 30)).toFixed(2);   // 20.42, index total_size
      var CONC = 16, CONC_DEFAULT = 8;     // article value; 0.17.x default clients (env-vars.md)
      var CHUNK_MIB = 8, RING = 18, MEM_DEFAULT_GB = 40, NIC_GBPS = 50;

      // ---- illustrative timing (seconds): each link moves a whole checkpoint in 4 s, same in both lanes
      var PERIOD = 12, PHASE = 4, REST = 10;

      var g = document.getElementById(ID + '-g');

      // ====== lane A: default loader (drawn at its top position, shifted down in step 0)
      var gA = el('g', {}, g);
      el('text', { 'class': 'tA', x: 20, y: 36 }, gA, 'default loader');
      el('text', { 'class': 'sub', x: 262, y: 36 }, gA, 'fetch everything, then load');
      var AY = 58, AH = 74;
      el('rect', { 'class': 'bxA', x: 20, y: AY, width: 180, height: AH, rx: 10 }, gA);
      el('text', { 'class': 'nmc', x: 110, y: AY + 44 }, gA, 'Hub or S3');
      el('rect', { 'class': 'bxA', x: 420, y: AY, width: 200, height: AH, rx: 10 }, gA);
      el('text', { 'class': 'nmc', x: 520, y: AY + 30 }, gA, 'local disk');
      el('rect', { 'class': 'trk', x: 438, y: AY + 46, width: 164, height: 12, rx: 6 }, gA);
      var diskFill = el('rect', { 'class': 'fillD', x: 438, y: AY + 46, width: 0, height: 12, rx: 6 }, gA);
      el('rect', { 'class': 'bxA', x: 880, y: AY, width: 220, height: AH, rx: 10 }, gA);
      el('text', { 'class': 'nm', x: 898, y: AY + 30 }, gA, 'GPU');
      var pctA = el('text', { 'class': 'pct', x: 1082, y: AY + 30 }, gA, '0%');
      el('rect', { 'class': 'trk', x: 898, y: AY + 46, width: 184, height: 12, rx: 6 }, gA);
      var gpuAFill = el('rect', { 'class': 'fillG', x: 898, y: AY + 46, width: 0, height: 12, rx: 6 }, gA);
      el('line', { 'class': 'ln', x1: 204, y1: AY + 37, x2: 416, y2: AY + 37 }, gA);
      el('line', { 'class': 'ln', x1: 624, y1: AY + 37, x2: 876, y2: AY + 37 }, gA);
      var ph1 = el('text', { 'class': 'ph', x: 310, y: AY + 22 }, gA, '1. copy all');
      var ph2 = el('text', { 'class': 'ph', x: 750, y: AY + 22 }, gA, '2. then load');

      // ====== lane B: Run:ai Model Streamer
      var gB = el('g', {}, g);
      el('text', { 'class': 'tB', x: 20, y: 204 }, gB, 'Run:ai Model Streamer');
      el('text', { 'class': 'sub', x: 372, y: 204 }, gB, 'read and copy overlap');
      var BY = 226, BH = 120, MID = BY + BH / 2;
      // S3 box with three shard bars (length proportional to size)
      var s3 = el('g', {}, gB);
      el('rect', { 'class': 'bxB', x: 20, y: BY, width: 180, height: BH, rx: 10 }, s3);
      el('text', { 'class': 'nm', x: 36, y: BY + 32 }, s3, 'S3 shards');
      SHARD_GB.forEach(function (gb, i) {
        el('rect', { 'class': 'shard', x: 36, y: BY + 50 + i * 24, width: gb / 9.99 * 148, height: 16, rx: 3 }, s3);
      });
      // readers box: 16 clients
      var rdG = el('g', {}, gB);
      el('rect', { 'class': 'bxB', x: 250, y: BY, width: 220, height: BH, rx: 10 }, rdG);
      el('text', { 'class': 'nm', x: 266, y: BY + 32 }, rdG, 'readers');
      var readers = [];
      for (var i = 0; i < CONC; i++) {
        readers.push(el('rect', { 'class': 'rd', x: 264 + (i % 8) * 24, y: BY + 56 + Math.floor(i / 8) * 28, width: 16, height: 16, rx: 3 }, rdG));
      }
      // buffer box: 18 ring buffers
      var bfG = el('g', {}, gB);
      el('rect', { 'class': 'bxB', x: 530, y: BY, width: 270, height: BH, rx: 10 }, bfG);
      el('text', { 'class': 'nm', x: 546, y: BY + 32 }, bfG, 'CPU buffer');
      var ring = [];
      for (i = 0; i < RING; i++) {
        var rx = 543 + (i % 9) * 28, ry = BY + 52 + Math.floor(i / 9) * 32;
        el('rect', { 'class': 'rbo', x: rx, y: ry, width: 22, height: 22, rx: 3 }, bfG);
        ring.push(el('rect', { 'class': 'rb', x: rx + 2, y: ry + 2, width: 18, height: 18, rx: 2 }, bfG));
      }
      // GPU box
      var gpG = el('g', {}, gB);
      el('rect', { 'class': 'bxB', x: 880, y: BY, width: 220, height: BH, rx: 10 }, gpG);
      el('text', { 'class': 'nm', x: 898, y: BY + 32 }, gpG, 'GPU');
      var pctB = el('text', { 'class': 'pct', x: 1082, y: BY + 32 }, gpG, '0%');
      el('rect', { 'class': 'trk', x: 898, y: BY + 74, width: 184, height: 18, rx: 9 }, gpG);
      var gpuBFill = el('rect', { 'class': 'fillG', x: 898, y: BY + 74, width: 0, height: 18, rx: 9 }, gpG);
      // arrows
      el('line', { 'class': 'ln', x1: 204, y1: MID, x2: 246, y2: MID }, gB);
      el('line', { 'class': 'ln', x1: 474, y1: MID, x2: 526, y2: MID }, gB);
      el('line', { 'class': 'ln', x1: 804, y1: MID, x2: 876, y2: MID }, gB);

      // ---- labels under lane B (steps 1, 2, 3)
      var tS = el('g', {}, g), tR = el('g', {}, g), tF = el('g', {}, g);
      el('text', { 'class': 'k2', x: 20, y: 384 }, tS, '3 shards');
      el('text', { 'class': 'k3', x: 20, y: 412 }, tS, WEIGHTS_GIB + ' GiB');
      el('text', { 'class': 'k2', x: 880, y: 384 }, tS, 'clone, then copy');
      el('text', { 'class': 'k3', x: 880, y: 412 }, tS, 'tensor by tensor');
      el('text', { 'class': 'k1', x: 250, y: 384 }, tR, 'concurrency ' + CONC);
      el('text', { 'class': 'k2', x: 250, y: 412 }, tR, 'default ' + CONC_DEFAULT + ' clients');
      el('text', { 'class': 'k2', x: 250, y: 440 }, tR, CHUNK_MIB + ' MiB chunks');
      el('text', { 'class': 'k3', x: 250, y: 468 }, tR, 'NIC ceiling ' + NIC_GBPS + ' Gbps');
      el('text', { 'class': 'k1', x: 530, y: 384 }, tF, 'memory_limit');
      el('text', { 'class': 'k2', x: 530, y: 412 }, tF, 'default ' + MEM_DEFAULT_GB + ' GB');
      el('text', { 'class': 'k2', x: 530, y: 440 }, tF, RING + ' ring buffers');
      el('text', { 'class': 'k3', x: 530, y: 468 }, tF, 'pod RAM: buffer + ~10 GiB');

      // ---- chunk particles (small squares moving along each arrow)
      function chunks(parent, cls, n, size, y) {
        var out = [];
        for (var c = 0; c < n; c++) out.push(el('rect', { 'class': cls, x: 0, y: y - size / 2, width: size, height: size, rx: 2 }, parent));
        return out;
      }
      var AY37 = AY + 37;
      var flows = [
        { list: chunks(gA, 'chA', 7, 10, AY37), x0: 204, x1: 416, speed: 0.9 },
        { list: chunks(gA, 'chA', 8, 10, AY37), x0: 624, x1: 876, speed: 0.9 },
        { list: chunks(gB, 'chB', 2, 8, MID), x0: 204, x1: 246, speed: 1.4 },
        { list: chunks(gB, 'chB', 2, 8, MID), x0: 474, x1: 526, speed: 1.4 },
        { list: chunks(gB, 'chB', 3, 8, MID), x0: 804, x1: 876, speed: 1.4 }
      ];
      function flow(f, t, on) {
        var span = f.x1 - f.x0 - 12;
        f.list.forEach(function (r, i) {
          r.setAttribute('x', (f.x0 + 2 + (((t * f.speed) + i / f.list.length) % 1) * span).toFixed(1));
          r.setAttribute('opacity', on ? '1' : '0');
        });
      }

      // ---- one frame at time t (seconds in the loop); rest = frozen final picture for reduced motion
      function render(t, rest) {
        var drain = t >= 11 ? Math.max(0, 12 - t) : 1;
        var a1 = clamp(t / PHASE), a2 = clamp((t - PHASE) / PHASE);
        var bF = clamp((t - 0.5) / PHASE);
        diskFill.setAttribute('width', (164 * a1 * drain).toFixed(1));
        gpuAFill.setAttribute('width', (184 * a2 * drain).toFixed(1));
        gpuBFill.setAttribute('width', (184 * bF * drain).toFixed(1));
        pctA.textContent = Math.round(a2 * drain * 100) + '%';
        pctB.textContent = Math.round(bF * drain * 100) + '%';
        ph1.classList.toggle('on', !rest && t < PHASE);
        ph2.classList.toggle('on', !rest && t >= PHASE && t < 2 * PHASE);
        flow(flows[0], t, !rest && t < PHASE);
        flow(flows[1], t, !rest && t >= PHASE && t < 2 * PHASE);
        flow(flows[2], t, !rest && t < 4.0);
        flow(flows[3], t, !rest && t >= 0.2 && t < 4.2);
        flow(flows[4], t, !rest && t >= 0.5 && t < 4.5);
        var active = !rest && t < 4.5;
        var w = rest ? 2.2 : t;
        ring.forEach(function (r, i) {
          var v = 0.5 + 0.5 * Math.sin(2 * Math.PI * (w * 0.9 - i / RING));
          r.setAttribute('opacity', (rest || active ? 0.15 + 0.85 * v : 0.3).toFixed(3));
        });
        readers.forEach(function (r, j) {
          var v = 0.5 + 0.5 * Math.sin(2 * Math.PI * (w * 1.3 - j / CONC));
          r.setAttribute('opacity', (rest ? 0.85 : active ? 0.3 + 0.7 * v : 0.5).toFixed(3));
        });
      }

      // ---- steps: s[0] lane B in (lane A moves up), s[1] reader knobs, s[2] buffer knobs
      var s = [0, 0, 0], cancel = null, stopLoop = null, A_DY = 150;
      function layout() {
        gA.setAttribute('transform', 'translate(0 ' + ((1 - s[0]) * A_DY).toFixed(2) + ')');
        gB.setAttribute('opacity', s[0].toFixed(3));
        tS.setAttribute('opacity', s[0].toFixed(3));
        tR.setAttribute('opacity', s[1].toFixed(3));
        tF.setAttribute('opacity', s[2].toFixed(3));
      }
      layout();
      render(REST, true);

      Deck.slide(ID, {
        enter: function () {
          s = [0, 0, 0]; layout();
          if (stopLoop) stopLoop();
          stopLoop = Deck.loop(function (secs) {
            if (Deck.reduced) { render(REST, true); return; }
            render(secs % PERIOD, false);
          });
        },
        leave: function () { if (stopLoop) { stopLoop(); stopLoop = null; } },
        step: function (m, prev, c) {
          var t = [m >= 1 ? 1 : 0, m >= 2 ? 1 : 0, m >= 3 ? 1 : 0];
          if (cancel) { cancel(); cancel = null; }
          if (c.instant) { s = t; layout(); return; }
          var f = s.slice();
          cancel = Deck.tween(800, function (kk) {
            s = f.map(function (v, i) { return Deck.lerp(v, t[i], kk); });
            layout();
          });
        }
      });
    })();
  </script>
</section>
