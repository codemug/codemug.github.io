# Part 4, section 5: dashboard + autoscaling queries as Prometheus recording rules.
# Targets: vLLM v0.32.0 metric names (vllm:*), llm-d router v1.0.0 EPP names (llm_d_epp_*).
# Each `expr` is also the exact text to paste into a Grafana panel (swap [5m] for [$__rate_interval])
# or into a KEDA trigger `query:` field. Placeholders: model_name="qwen38-27b-nvfp4", name="qwen38-27b-nvfp4",
# service="qwen38-27b-nvfp4-epp". Validated with: promtool check rules + promtool test rules (see queries.test.yml).
groups:
  # ---------------------------------------------------------------- Traffic
  - name: llm-traffic
    rules:
      # 1. Finished requests per second, split by why they finished.
      - record: llm:request_rate_by_reason:rate5m
        expr: sum by (model_name, finished_reason) (rate(vllm:request_success_total[5m]))
      # 2. Share of finished requests that ended in a server-side error.
      - record: llm:request_error_ratio:rate5m
        expr: |
          sum by (model_name) (rate(vllm:request_success_total{finished_reason="error"}[5m]))
          /
          sum by (model_name) (rate(vllm:request_success_total[5m]))

  # ---------------------------------------------------------------- Latency
  - name: llm-latency
    rules:
      # 3-5. Time to first token (queue + prefill), seen by vLLM.
      - record: llm:ttft_seconds:p50
        expr: histogram_quantile(0.50, sum by (le, model_name) (rate(vllm:time_to_first_token_seconds_bucket[5m])))
      - record: llm:ttft_seconds:p95
        expr: histogram_quantile(0.95, sum by (le, model_name) (rate(vllm:time_to_first_token_seconds_bucket[5m])))
      - record: llm:ttft_seconds:p99
        expr: histogram_quantile(0.99, sum by (le, model_name) (rate(vllm:time_to_first_token_seconds_bucket[5m])))
      # 6. Inter-token latency (time between streamed outputs).
      - record: llm:itl_seconds:p95
        expr: histogram_quantile(0.95, sum by (le, model_name) (rate(vllm:inter_token_latency_seconds_bucket[5m])))
      # 7. End-to-end request latency.
      - record: llm:e2e_seconds:p95
        expr: histogram_quantile(0.95, sum by (le, model_name) (rate(vllm:e2e_request_latency_seconds_bucket[5m])))
      # 8. Time spent in the WAITING state before the first scheduling.
      - record: llm:queue_seconds:p95
        expr: histogram_quantile(0.95, sum by (le, model_name) (rate(vllm:request_queue_time_seconds_bucket[5m])))

  # ---------------------------------------------------------------- Saturation
  - name: llm-saturation
    rules:
      # 9-10. Requests in the running batch and requests waiting, summed over pods.
      - record: llm:requests_running:sum
        expr: sum by (model_name) (vllm:num_requests_running)
      - record: llm:requests_waiting:sum
        expr: sum by (model_name) (vllm:num_requests_waiting)
      # 11-12. KV cache usage (fraction 0..1): average and worst pod.
      - record: llm:kv_cache_usage:avg
        expr: avg by (model_name) (vllm:kv_cache_usage_perc)
      - record: llm:kv_cache_usage:max
        expr: max by (model_name) (vllm:kv_cache_usage_perc)
      # 13. Preemptions per second (requests evicted from the batch, recomputed later).
      - record: llm:preemptions:rate5m
        expr: sum by (model_name) (rate(vllm:num_preemptions_total[5m]))

  # ---------------------------------------------------------------- Cache effectiveness
  - name: llm-cache
    rules:
      # 14. Local (GPU) prefix cache hit ratio: hit tokens / queried tokens, sum first then divide.
      - record: llm:prefix_cache_hit_ratio:rate5m
        expr: |
          sum by (model_name) (rate(vllm:prefix_cache_hits_total[5m]))
          /
          sum by (model_name) (rate(vllm:prefix_cache_queries_total[5m]))
      # 14b. Share of prompt tokens served from any cache tier (local + connector). vLLM >= v0.18.
      - record: llm:prompt_cached_ratio:rate5m
        expr: |
          sum by (model_name) (rate(vllm:prompt_tokens_cached_total[5m]))
          /
          sum by (model_name) (rate(vllm:prompt_tokens_total[5m]))
      # 14c. The same share split by tier (device, host, disk, p2p). vLLM >= v0.32 only.
      - record: llm:prompt_cached_ratio_by_source:rate5m
        expr: |
          sum by (model_name, source) (rate(vllm:prompt_tokens_cached_by_source_total[5m]))
          /
          on (model_name) group_left
          sum by (model_name) (rate(vllm:prompt_tokens_total[5m]))

  # ---------------------------------------------------------------- Throughput
  - name: llm-throughput
    rules:
      # 15-16. Prompt (prefill) and generated (decode) tokens per second.
      - record: llm:prompt_tokens:rate5m
        expr: sum by (model_name) (rate(vllm:prompt_tokens_total[5m]))
      - record: llm:generation_tokens:rate5m
        expr: sum by (model_name) (rate(vllm:generation_tokens_total[5m]))

  # ---------------------------------------------------------------- Speculative decoding
  - name: llm-spec-decode
    rules:
      # 17. Accepted draft tokens / proposed draft tokens (from vllm/v1/spec_decode/metrics.py docstring).
      - record: llm:spec_decode_acceptance_ratio:rate5m
        expr: |
          sum by (model_name) (rate(vllm:spec_decode_num_accepted_tokens_total[5m]))
          /
          sum by (model_name) (rate(vllm:spec_decode_num_draft_tokens_total[5m]))
      # 17b. Mean tokens emitted per verification step, bonus token included.
      - record: llm:spec_decode_mean_acceptance_length:rate5m
        expr: |
          1 + (
            sum by (model_name) (rate(vllm:spec_decode_num_accepted_tokens_total[5m]))
            /
            sum by (model_name) (rate(vllm:spec_decode_num_drafts_total[5m]))
          )

  # ---------------------------------------------------------------- EPP (llm-d router v1.0.0 names)
  - name: llm-epp
    rules:
      # 18. Pool-level averages the EPP computes over the model servers it scrapes.
      - record: llm:epp_pool_queue_size:avg
        expr: max by (name) (llm_d_epp_average_queue_size)
      - record: llm:epp_pool_kv_cache_utilization:avg
        expr: max by (name) (llm_d_epp_average_kv_cache_utilization)
      # 19. Endpoints with fresh metrics (not the same thing as Kubernetes Ready).
      - record: llm:epp_ready_endpoints
        expr: max by (name) (llm_d_epp_ready_endpoints)
      # 20. Time the EPP spent choosing an endpoint.
      - record: llm:epp_scheduler_seconds:p95
        expr: histogram_quantile(0.95, sum by (le) (rate(llm_d_epp_scheduler_e2e_duration_seconds_bucket[5m])))
      # 20b. TTFT as the router sees it (request received to first response byte).
      - record: llm:epp_ttft_seconds:p95
        expr: histogram_quantile(0.95, sum by (le) (rate(llm_d_epp_request_ttft_seconds_bucket[5m])))

  # ---------------------------------------------------------------- KEDA trigger queries (each returns ONE series)
  - name: llm-keda
    rules:
      # KEDA pairing (see NOTES.md): the EPP gauges and the p95 are PER-POD or non-additive values, so the
      # trigger needs `metricType: Value` (HPA: ceil(ready pods * value / threshold)). KEDA's default,
      # AverageValue, computes ceil(value / threshold) and ignores the replica count.
      # K1. Mean queue depth per pod, from the EPP. max() collapses duplicate series
      #     (two Prometheus replicas, an HA EPP pair) into exactly one element.
      - record: llm:keda:pool_queue_size
        expr: max(llm_d_epp_average_queue_size{name="qwen38-27b-nvfp4"})
      # K2. Mean KV cache utilization (0..1) per pod, from the EPP.
      - record: llm:keda:pool_kv_cache_utilization
        expr: max(llm_d_epp_average_kv_cache_utilization{name="qwen38-27b-nvfp4"})
      # K3. Lagging safety net: p95 TTFT at the router. EPP request metrics carry no pool label,
      #     so select the EPP with a scrape-time label (service here). sum by (le) leaves one series.
      - record: llm:keda:epp_ttft_p95_seconds
        expr: histogram_quantile(0.95, sum by (le) (rate(llm_d_epp_request_ttft_seconds_bucket{service="qwen38-27b-nvfp4-epp"}[5m])))
      # K4 (alternative when you run vLLM without an EPP): total waiting requests for one model.
      #     This one is a SUM, so metricType AverageValue (the KEDA default) is correct: ceil(total / threshold).
      # K5. Worst pod: the highest KV cache utilization (0..1) of any pod. Pool averages hide one saturated pod
      #     (see the routing section); the max does not. A max is not additive, so metricType Value.
      - record: llm:keda:worst_pod_kv_cache_utilization
        expr: max(vllm:kv_cache_usage_perc{model_name="qwen38-27b-nvfp4"})
      - record: llm:keda:vllm_waiting_total
        expr: sum(vllm:num_requests_waiting{model_name="qwen38-27b-nvfp4"})

  # ---------------------------------------------------------------- KEDA leading signals (each returns ONE series)
  # A new vLLM pod needs a node, an image, the weights, torch.compile and CUDA graph capture before it is Ready, so
  # these queries look ahead (or confirm a queue that will not clear) instead of waiting for users to feel a full cache.
  - name: llm-keda-leading
    rules:
      # K6. Where the hottest pod's KV cache usage (0..1) will be 10 minutes from now, from a straight line fitted to
      #     the last 15 minutes. max() comes first and the fit second: a new pod with an empty cache climbs steeply at
      #     first, but it is not the hottest pod, so it cannot fake a trend. A short window is noisy (the cache swings by
      #     several points in 30 seconds), so the fit needs 15 minutes. clamp keeps the answer in 0..1 (a cache cannot
      #     be more than full). The second half drops the answer until the max series has 20 points (10 minutes) of
      #     history, because a series that is only a few samples old (first install, a Prometheus restart) shows a wild
      #     slope. A max is not additive, so the trigger uses metricType Value.
      - record: llm:keda:worst_pod_kv_cache_forecast
        expr: |
          clamp(predict_linear(max(vllm:kv_cache_usage_perc{model_name="qwen38-27b-nvfp4"})[15m:30s], 600), 0, 1)
          and
          count_over_time(max(vllm:kv_cache_usage_perc{model_name="qwen38-27b-nvfp4"})[15m:30s]) >= 20
      # K7. Requests in the running batch, summed over pods. The Deployment sets --max-num-seqs=64, so the batch is full
      #     at 64 requests per pod and 32 per pod is a half-full batch. A sum is additive, so the trigger uses
      #     metricType AverageValue with threshold 32: ceil(total / 32).
      - record: llm:keda:vllm_running_total
        expr: sum(vllm:num_requests_running{model_name="qwen38-27b-nvfp4"})
      # K8. The shortest the hottest pod's capacity queue got in the last 3 minutes. It is above 0 only if some pod had
      #     a request waiting for capacity at every point of those 3 minutes, so one request that waits for a long prefill
      #     does not count. reason="capacity" leaves out requests parked for other reasons (a KV fetch in flight, the LoRA
      #     budget). The target is an empty queue, so the trigger threshold is just under 1. metricType Value.
      - record: llm:keda:worst_pod_queue_sustained
        expr: min_over_time(max(vllm:num_requests_waiting_by_reason{model_name="qwen38-27b-nvfp4",reason="capacity"})[3m:15s])
      # K9. Lagging safety net: p95 time to first token (queue + prefill), straight from vLLM. The second half drops the
      #     answer when fewer than 0.2 first tokens arrive per second (60 in 5 minutes), because with a handful of
      #     requests the p95 is decided by one long prompt. No traffic gives an empty result, which KEDA reads as 0.
      - record: llm:keda:ttft_p95_seconds
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket{model_name="qwen38-27b-nvfp4"}[5m])))
          and
          sum(rate(vllm:time_to_first_token_seconds_count{model_name="qwen38-27b-nvfp4"}[5m])) > 0.2
