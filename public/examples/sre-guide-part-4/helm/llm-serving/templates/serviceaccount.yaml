# Nothing to annotate: the IAM role comes from an EKS Pod Identity association (terraform/pod_identity.tf).
# With IRSA instead, add the annotation eks.amazonaws.com/role-arn: <role arn> here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "llm-serving.modelName" . }}
  namespace: {{ .Release.Namespace }}
