{{- if .Values.autoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "llm-serving.modelName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    name: {{ include "llm-serving.modelName" . }}          # the vLLM Deployment
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}                # a floor: scale-out is slow (node, image, weights), so never start from zero
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  fallback:
    # if a Prometheus trigger fails 3 polls in a row, hold 2 replicas instead of trusting a broken metric
    failureThreshold: 3
    replicas: {{ .Values.autoscaling.fallbackReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 2              # at most 2 new replicas a minute: each one is slow to become useful
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    # mean queued requests per pod, as the endpoint picker sees it. A per-pod average is not additive,
    # so the metric type is Value: desired = ceil(current replicas x value / threshold)
    - type: prometheus
      name: queue
      metricType: Value
      metadata:
        serverAddress: {{ .Values.autoscaling.prometheusAddress }}
        query: max(llm_d_epp_average_queue_size{name="{{ include "llm-serving.modelName" . }}"})
        threshold: "{{ .Values.autoscaling.queueThreshold }}"
    # the hottest pod's KV cache utilization (0 to 1); an average would hide one saturated pod
    - type: prometheus
      name: worst-pod-kv-cache
      metricType: Value
      metadata:
        serverAddress: {{ .Values.autoscaling.prometheusAddress }}
        query: max(vllm:kv_cache_usage_perc{model_name="{{ include "llm-serving.modelName" . }}"})
        threshold: "{{ .Values.autoscaling.kvCacheThreshold }}"
    # an on-hours floor: inside the window this acts as a dynamic minimum, and the triggers above can push higher
    - type: cron
      name: business-hours
      metadata:
        timezone: {{ .Values.autoscaling.businessHours.timezone }}
        start: {{ .Values.autoscaling.businessHours.start }}
        end: {{ .Values.autoscaling.businessHours.end }}
        desiredReplicas: "{{ .Values.autoscaling.businessHours.replicas }}"
{{- end }}
